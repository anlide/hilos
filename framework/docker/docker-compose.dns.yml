# In-tailnet dev DNS for the Hilos preview lane.
#
# Resolves every *.hilos name to the host's Tailscale IP so demos are reachable by
# readable names (chat.hilos, pma.chat.hilos, ...) instead of IP:port. A reverse
# proxy (Caddy) then routes each name to the right demo port. DEV-only convenience:
# pair it with a Tailscale split-DNS rule (domain `hilos` -> this host's Tailscale
# IP) so the names resolve only inside the tailnet.
#
# Host networking on purpose: a bridge-published :53 arrives via NAT with a source
# outside the container subnet, which dnsmasq drops under its default
# "local-service" rule. Binding straight to the Tailscale IP keeps source IPs real.
# --listen-address disables local-service; --bind-dynamic binds only that address,
# so it never clashes with the host's systemd-resolved stub on 127.0.0.53.
# Override HILOS_DEV_DNS_IP for a different host.
name: hilos-framework-dns

services:
  hilos-dev-dns:
    image: 4km3/dnsmasq@sha256:52e25fb2601156ab66f6a0872c180b285df7cafaa41267d8d65689f066490641
    container_name: hilos-dev-dns
    network_mode: host
    entrypoint: ["dnsmasq"]
    command:
      - "-k"                 # keep in foreground so the container stays up
      - "--log-facility=-"   # log to stderr (visible via docker logs)
      - "--no-resolv"        # only answer the .hilos split zone, never forward
      - "--bind-dynamic"     # bind only the address below, not a 0.0.0.0 wildcard
      - "--listen-address=${HILOS_DEV_DNS_IP:-100.111.250.126}"
      - "--address=/hilos/${HILOS_DEV_DNS_IP:-100.111.250.126}"
    restart: unless-stopped
