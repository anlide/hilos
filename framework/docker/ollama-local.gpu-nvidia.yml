# GPU override for ollama-local (NVIDIA).
# Use: docker compose -f framework/docker/ollama-local.yml -f framework/docker/ollama-local.gpu-nvidia.yml up -d
#
# Prerequisites: NVIDIA Container Toolkit, drivers for WSL2/Linux

services:
  ollama-local:
    volumes:
      - ollama-local-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-local-data:
    name: hilos-ollama-local-data
