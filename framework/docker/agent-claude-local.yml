# Docker Compose for local Claude agent server (framework-level, standalone).
# Exposes port 9308 to host. Run separately from demos.
#
# Usage:
#   docker compose -f framework/docker/agent-claude-local.yml up -d

name: hilos-agent-claude-local

services:
  agent-claude-local:
    build:
      context: ../..
      dockerfile: framework/agent-claude/Dockerfile
    container_name: hilos-agent-claude-local
    env_file:
      - ../../.env
    environment:
      - AGENT_CLAUDE_HOST=0.0.0.0
      - AGENT_CLAUDE_PORT=9308
      - AGENT_CLAUDE_WORKSPACE_ROOT=/workspace
      - AGENT_CLAUDE_ALLOWED_ROOTS=${AGENT_CLAUDE_ALLOWED_ROOTS:-/workspace}
      - AGENT_CLAUDE_DATA_DIR=/data
      - AGENT_CLAUDE_REPORTS_DIR=/data/reports
      - AGENT_CLAUDE_RUNS_DIR=/data/runs
      - AGENT_CLAUDE_FINGERPRINT_FILE=/data/fingerprints.json
      - AGENT_CLAUDE_MAX_FILE_SIZE_BYTES=${AGENT_CLAUDE_MAX_FILE_SIZE_BYTES:-256000}
      - AGENT_CLAUDE_MAX_LIST_FILES=${AGENT_CLAUDE_MAX_LIST_FILES:-1000}
      - AGENT_CLAUDE_MAX_TURNS=${AGENT_CLAUDE_MAX_TURNS:-25}
      - AGENT_CLAUDE_PROMPT_TEMPLATE_VERSION=${AGENT_CLAUDE_PROMPT_TEMPLATE_VERSION:-2026-04-05}
      - CLAUDE_MODEL=claude-sonnet-4-6
    volumes:
      - ../..:/workspace:ro
      - agent-claude-local-data:/data
    ports:
      - "9308:9308"
    restart: unless-stopped

volumes:
  agent-claude-local-data:
    name: hilos-agent-claude-local-data