# Reverse proxy for the in-tailnet Hilos preview lane (see caddy/Caddyfile).
#
# Host networking so Caddy can bind the Tailscale IP directly and reach each
# demo on 127.0.0.1:<port>. The /data volume persists the internal CA so the
# root cert installed on devices stays valid across restarts.
name: hilos-framework-caddy

services:
  hilos-preview-caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: hilos-preview-caddy
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hilos-preview-caddy-data:/data
      - hilos-preview-caddy-config:/config
    restart: unless-stopped

volumes:
  hilos-preview-caddy-data:
  hilos-preview-caddy-config:
