# Docker Compose for local Ollama (framework-level, standalone).
# Exposes port 11434 to host. Run separately from demos.
#
# Usage:
#   docker compose -f framework/docker/ollama-local.yml up -d
#
# Demos connect via LLM_LOCAL_URL (e.g. http://host.docker.internal:11434)
# and do not depend on this project's internals.

name: hilos-ollama-local

services:
  ollama-local:
    image: ollama/ollama:latest
    container_name: hilos-ollama-local
    volumes:
      - ollama-local-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    restart: unless-stopped

volumes:
  ollama-local-data:
    name: hilos-ollama-local-data
