# The frontend SDK's Node CLI runner, in a compose project of its own.
#
# Separate from framework/docker/docker-compose.yml because `docker compose down`
# only ever reaches inside its own project: while this service lived in the
# framework project, taking the framework test stand down killed the container the
# frontend steps were running in, and the step died with rc=137 and no reason.
# The runner is a tool the steps run inside, not a service of any stand, so it owns
# the whole of this file and nothing shares the project with it.

name: hilos-frontend${HILOS_STAND_SUFFIX:-}

services:
  # --- Frontend SDK Node CLI runner ------------------------------------------
  # Install, build, lint and unit tests run here — never on the host Node.
  # node_modules lands in the project via the bind-mount, where PhpStorm sees it.
  hilos-frontend-cli:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: node:24-bookworm-slim
    container_name: hilos-frontend-cli${HILOS_STAND_SUFFIX:-}
    volumes:
      - ../..:/hilos
    working_dir: /hilos/framework/frontend
    # The runner needs only the way out to the npm registry. Docker's built-in
    # bridge already exists; a project network of its own would come from the
    # default address pools on every run and stay behind until a down.
    network_mode: bridge
    environment:
      # Silence npm's update-notifier; the version is pinned by the image.
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    # A crashing Node (an out-of-memory abort in a test worker) must not drop a
    # multi-gigabyte, root-owned core file into the bind-mounted project.
    ulimits:
      core: 0
