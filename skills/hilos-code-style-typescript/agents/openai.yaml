interface:
  display_name: "Hilos Code Style — TypeScript"
  short_description: "TypeScript style and behavioral unit/component tests"
  default_prompt: "Use $hilos-code-style-typescript to apply Hilos frontend TypeScript style and review unit/component tests for behavior, accessibility and semantics rather than styling. For test assertions and file placement, read docs/agents/frontend/testing-strategy.md. When reading or displaying refusal words or adding a local fallback, read the section A failure reason is a domain sentence, never an engine message in docs/agents/frontend/wire-protocol.md. When parsing or displaying a moment, or choosing the reader’s time zone, read docs/agents/architecture/time-zones.md."
