interface:
  display_name: "Hilos App Data Access"
  short_description: "Use Hilos::$db, Hilos::$rt, and topology from app code"
  default_prompt: "Use $hilos-app-data-access to read and write Hilos DB/RT state from pages, tables, agents, actions, and topology-aware callers, or when you need every row of an entity or a row that has no owner yet, or when a table is the reader and you need to know who serves it, or when you write a row from an agent and need to know whether it owns the table whole or only its own set."
