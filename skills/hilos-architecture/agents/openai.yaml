interface:
  display_name: "Hilos Architecture"
  short_description: "Daemon, worker, lifecycle, and event-loop rules"
  default_prompt: "Use $hilos-architecture to modify Hilos lifecycle or event-loop behavior, or to decide which node of a cluster runs an agent or holds an entity. For explicit process/database UTC at startup, the project time zone, cron or calendar retention boundaries, read docs/agents/architecture/time-zones.md. For moment storage or migration planning and its boundary with UTC and project/reader zones, read docs/agents/architecture/time-zones.md#database-moment-storage and the published research in docs/agents/architecture/moment-storage.md. For a calculated result's basis, invalidation, reset or rebuilding after settings or environment changes, read the approved research design in docs/agents/architecture/calculated-results.md."
