interface:
  display_name: "Hilos E2E Testing"
  short_description: "Choose e2e coverage, scenarios, owned fixtures and timer commands"
  default_prompt: "Use $hilos-e2e-testing to choose or review behavioral coverage before adding or extending a scenario, import each demo's test through its local e2e entry, and create, edit, move, split or port specs and browser/Node-only helpers using shared toolboxes and test-owned preconditions; bring any timer to now with its test-only command instead of waiting it out. For literals in e2e specs and shared helpers, read docs/agents/code-style/magic-values.md#tests. Check the explicit, fixed browser time zone and use the authoring command for new literals under docs/agents/frontend/testing-strategy.md#explicit-browser-time-zones. Before sharing an already repeated SDK screen scenario, read Shared behavior across view frameworks, Which demo carries a spec and Shared screen scenario registration in docs/agents/frontend/testing-strategy.md; retain one carrier for server proof and local test/expect and fixtures for screen registrations."
