# CLI is default-on for the harness; Mailpit and Playwright remain e2e-only.
services:
  online-testing-cluster-cli:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: ..
      additional_contexts:
        hilos-event: ../../../../framework/docker/native/event
    container_name: online-testing-cluster-cli${HILOS_STAND_SUFFIX:-}
    entrypoint: [sh, /hilos/framework/docker/test-writer-entrypoint.sh]
    working_dir: /app
    command: ["sleep", "infinity"]
    tmpfs:
      - /app/tests
    environment:
      HILOS_TEST_OWNER_ROOT: /app
      HILOS_TEST_WRITE_DIRS: /app/data /app/vendor
      HILOS_TEST_OWN_DIRS: /hilos-test-logs
      HOME: /tmp
      APP_ENV: test
      DB_HOST: online-testing-cluster-mysql
      DB_PORT: "3306"
      DB_DATABASE: hilos-demo-online-testing-cluster
      DB_USERNAME: hilos
      DB_PASSWORD: hilos_pass
      COMMAND_PORT: "8094"
    volumes:
      - ../../data/logs-cluster:/hilos-test-logs
      - ../..:/app
      - data:/app/data
      - ${HILOS_CLUSTER_TEST_ENV_FILE:-../../tests/.env}:/app/tests/.env:ro
      - ../../../../composer.json:/hilos/composer.json:ro
      - ../../../../composer.lock:/hilos/composer.lock:ro
      - ../../../../framework:/hilos/framework:ro
    depends_on:
      online-testing-cluster-mysql:
        condition: service_healthy
    networks:
      - cluster-net

  online-testing-cluster-mailpit:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: online-testing-cluster-mailpit${HILOS_STAND_SUFFIX:-}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    profiles: [e2e]
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.20

  online-testing-cluster-e2e-runner:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    container_name: online-testing-cluster-e2e-runner${HILOS_STAND_SUFFIX:-}
    entrypoint: [sh, /hilos/framework/docker/test-writer-entrypoint.sh]
    tmpfs:
      - /tmp
    volumes:
      - ../../../..:/hilos
    working_dir: /hilos/demo/online-testing/tests/e2e
    environment:
      HILOS_TEST_OWNER_ROOT: /hilos
      HILOS_TEST_WRITE_DIRS: >-
        /hilos/demo/online-testing/tests/e2e/node_modules /hilos/demo/online-testing/tests/e2e/test-results
        /hilos/demo/online-testing/tests/e2e/playwright-report /hilos/demo/online-testing/tests/.hilos-cluster-e2e
      HOME: /tmp
      CI: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      COMMAND_PORT: "8094"
      MAILPIT_URL: http://online-testing-cluster-mailpit:8025
      HILOS_E2E_TIMEOUT_SCALE: ${HILOS_E2E_TIMEOUT_SCALE:-}
    profiles: [e2e]
    networks:
      - cluster-net
