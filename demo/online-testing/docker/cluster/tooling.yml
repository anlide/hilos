# CLI is default-on for the harness; Mailpit and Playwright remain e2e-only.
services:
  online-testing-cluster-cli:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: ..
      additional_contexts:
        hilos-event: ../../../../framework/docker/native/event
    container_name: online-testing-cluster-cli${HILOS_STAND_SUFFIX:-}
    working_dir: /app
    command: ["sleep", "infinity"]
    tmpfs:
      - /app/tests
    environment:
      APP_ENV: test
      DB_HOST: online-testing-cluster-mysql
      DB_PORT: "3306"
      DB_DATABASE: hilos-demo-online-testing-cluster
      DB_USERNAME: hilos
      DB_PASSWORD: hilos_pass
      COMMAND_PORT: "8094"
    volumes:
      - ../..:/app
      - ${HILOS_CLUSTER_TEST_ENV_FILE:-../../tests/.env.example}:/app/tests/.env:ro
      - ../../../../composer.json:/hilos/composer.json:ro
      - ../../../../composer.lock:/hilos/composer.lock:ro
      - ../../../../framework:/hilos/framework:ro
    depends_on:
      online-testing-cluster-mysql:
        condition: service_healthy
    networks:
      - cluster-net

  online-testing-cluster-mailpit:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: online-testing-cluster-mailpit${HILOS_STAND_SUFFIX:-}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    profiles: [e2e]
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.20

  online-testing-cluster-stand-gateway:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: ../../../../framework/docker/stand-gateway
      additional_contexts:
        hilos-event: ../../../../framework/docker/native/event
    container_name: online-testing-cluster-stand-gateway${HILOS_STAND_SUFFIX:-}
    volumes:
      - ../../../../framework:/hilos/framework:ro
    environment:
      MAILPIT_SMTP_HOST: online-testing-cluster-mailpit
      MAILPIT_SMTP_PORT: 1025
      SSL_CERT_FILE: /app/tls/ca.pem
      TZ: UTC
    depends_on:
      online-testing-cluster-mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"https://127.0.0.1:18000/test/health\") === false ? 1 : 0);'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    profiles: [e2e]
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.21
        aliases:
          - stand-gateway

  online-testing-cluster-e2e-runner:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    container_name: online-testing-cluster-e2e-runner${HILOS_STAND_SUFFIX:-}
    tmpfs:
      - /tmp
    volumes:
      - ../../../..:/hilos
    working_dir: /hilos/demo/online-testing/tests/e2e
    environment:
      CI: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      COMMAND_PORT: "8094"
      MAILPIT_URL: http://online-testing-cluster-mailpit:8025
      NODE_EXTRA_CA_CERTS: /hilos/framework/docker/stand-gateway/tls/ca.pem
      HILOS_E2E_TIMEOUT_SCALE: ${HILOS_E2E_TIMEOUT_SCALE:-}
    profiles: [e2e]
    networks:
      - cluster-net
