# Standalone MariaDB, also extended by the local stand. It has no Hilos-node dependency.
services:
  database:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mariadb:11.4
    labels:
      hilos.role: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-hilos-demo-online-testing-cluster}
      MYSQL_USER: ${DB_USERNAME:-hilos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hilos_pass}
      TZ: UTC
      MARIADB_MYSQL_LOCALHOST_USER: "1"
    volumes:
      - ${HILOS_CLUSTER_DB_DATA_DIR:-/dev/shm/hilos-online-testing-cluster-mysql-data${HILOS_STAND_SUFFIX:-}}:/var/lib/mysql
      - ../../../../framework/docker/mysql/test-stand.cnf:/etc/mysql/conf.d/zz-hilos-test-stand.cnf:ro
      - ../mysql/init-change-log.sh:/docker-entrypoint-initdb.d/init-change-log.sh:ro
      - ../mysql/provision-change-log.sh:/usr/local/bin/provision-change-log.sh:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    # Asked as the unix user mysql over the socket: the image's own healthcheck user gets a
    # random password that its option file misreads when it starts and ends with a double
    # quote, and that stand never turns healthy (about one boot in 8000).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--no-defaults", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "${HILOS_CLUSTER_BIND_ADDRESS:-127.0.0.1}:${HILOS_CLUSTER_DB_PUBLISHED_PORT:-3306}:3306"
