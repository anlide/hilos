# Local bindings only. The canonical standalone services do not enter this aggregate.
# Local ports and the per-node env selection replace standalone defaults explicitly.
services:
  online-testing-cluster-mysql:
    extends: {file: ./database.yml, service: database}
    container_name: online-testing-cluster-mysql${HILOS_STAND_SUFFIX:-}
    ports: !reset []
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.10

  online-testing-cluster-m1:
    extends: {file: ./node.yml, service: node}
    container_name: online-testing-cluster-m1${HILOS_STAND_SUFFIX:-}
    ports: !reset []
    env_file: !override
      - ../../.env.example
      - ./common.env
      - ./nodes/m1.env
    environment:
      SSL_CERT_FILE: /hilos/framework/docker/stand-gateway/tls/ca.pem
      HILOS_MODERATION_TEXT_URL: https://stand-gateway:18000/model
      HILOS_MODERATION_IMAGE_URL: https://stand-gateway:18000/model
    labels:
      hilos.role: app
    volumes:
      - data:/app/data
      - data-export:/app/data/data_export
      - ../../data/logs-cluster/m1:/var/log/hilos
      - status:/app/data/status
    depends_on:
      online-testing-cluster-mysql:
        condition: service_healthy
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.11

  online-testing-cluster-m2:
    extends: {file: ./node.yml, service: node}
    container_name: online-testing-cluster-m2${HILOS_STAND_SUFFIX:-}
    ports: !reset []
    env_file: !override
      - ../../.env.example
      - ./common.env
      - ./nodes/m2.env
    environment:
      SSL_CERT_FILE: /hilos/framework/docker/stand-gateway/tls/ca.pem
      HILOS_MODERATION_TEXT_URL: https://stand-gateway:18000/model
      HILOS_MODERATION_IMAGE_URL: https://stand-gateway:18000/model
    volumes:
      - data:/app/data
      - data-export:/app/data/data_export
      - ../../data/logs-cluster/m2:/var/log/hilos
      - status:/app/data/status
    depends_on:
      online-testing-cluster-mysql:
        condition: service_healthy
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.12

  online-testing-cluster-m3:
    extends: {file: ./node.yml, service: node}
    container_name: online-testing-cluster-m3${HILOS_STAND_SUFFIX:-}
    ports: !reset []
    env_file: !override
      - ../../.env.example
      - ./common.env
      - ./nodes/m3.env
    environment:
      SSL_CERT_FILE: /hilos/framework/docker/stand-gateway/tls/ca.pem
      HILOS_MODERATION_TEXT_URL: https://stand-gateway:18000/model
      HILOS_MODERATION_IMAGE_URL: https://stand-gateway:18000/model
    volumes:
      - data:/app/data
      - data-export:/app/data/data_export
      - ../../data/logs-cluster/m3:/var/log/hilos
      - status:/app/data/status
    depends_on:
      online-testing-cluster-mysql:
        condition: service_healthy
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.13

  online-testing-cluster-entry:
    extends: {file: ./entry.yml, service: entry}
    container_name: online-testing-cluster-entry${HILOS_STAND_SUFFIX:-}
    ports: !reset []
    volumes:
      - data-export:/data_export:ro
      - status:/status:ro
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.30

volumes:
  # The stand's own data root: the export agent deletes files without ready rows in its
  # own database at start and hourly, so the local installation's data/ must stay out of
  # its sight. Every node and the CLI mount this volume at /app/data, and the harness's
  # down --volumes clears it with the database each run.
  data:
    name: hilos-online-testing-cluster-data${HILOS_STAND_SUFFIX:-}

  # Exports sit on a volume of their own over that root because the entry reads them at
  # its own path, /data_export, and its part is shared with standalone and stays as is.
  # All three nodes and the entry share this disk.
  data-export:
    name: hilos-online-testing-cluster-data-export${HILOS_STAND_SUFFIX:-}

  # Independent test installations must not overwrite each other's Status files.
  # Every node and the entry within this cluster share this one volume.
  status:
    name: hilos-online-testing-cluster-status${HILOS_STAND_SUFFIX:-}

networks:
  cluster-net:
    name: hilos-online-testing-cluster-net${HILOS_STAND_SUFFIX:-}
    driver: bridge
    ipam:
      config:
        # Docker does not auto-assign 10/8, so these advertised addresses stay claimable.
        - subnet: 10.${HILOS_STAND_NET_ONLINE_TESTING_CLUSTER:-223}.0.0/16
