# The cluster stand of online-testing (HIL-1217): three equal masters that carry the work
# themselves, on a MariaDB Galera of three members that every node writes to, behind one
# proxy address (HIL-1230).
#
# One logical database carrying ONE schema for the whole stand (HIL-712) — the model
# Hilos is built on, and what makes "node A writes a row, node B reads it" sayable — held
# by the three members of a Galera cluster. The nodes see ONE address, an HAProxy that
# hands their connections out over all three members (leastconn), so writes arrive at
# every member; a read waits for the writes of the cluster (wsrep_sync_wait=1,
# docker/galera/galera.cnf), which is what the demo's declared READ_AFTER_WRITE asks of a
# multi-primary (docs/agents/app-topology.md, "Database Guarantees"). Beside them,
# three daemon nodes that roll that schema out themselves as they start together,
# under the rollout claim in the database (HIL-1228), on a dedicated bridge with
# static IPs — three masters, each the consensus and the data plane at once — and a
# long-lived CLI container the shared cluster harness `docker exec`s to run
# `test:cluster:inspect` against each node. Node role, identity, capabilities,
# master set, and timeouts all come from CLUSTER_* env, so the same image is a
# master or a data-plane node purely by configuration.
#
# A compose project of its own, beside the demo's local and test stacks rather than inside
# one of them: the demo's e2e steps take their whole project down when they start, and a
# fleet inside it would fall in the middle of its matrix. The nodes run the whole demo —
# every agent it registers, the framework's cluster probes among them — and publish nothing
# on the host: the harness reaches them through the cli container.

name: hilos-online-testing-cluster

# What the shared cluster harness (framework/docker/cluster/cluster.py) reads besides the services
# below; the nodes, their addresses, roles, room and log directories it takes from the services.
x-hilos-cluster:
  cli: online-testing-cluster-cli
  scenarios: [11, 15, 21, 22, 24, 26]

x-node-base: &node-base
  build: .
  restart: "no"
  command: ["php", "backend/Bootstrap/docker.php"]
  # The proxy is healthy once all three members are up behind it; a connection the proxy takes
  # with no member behind it reaches the client as error 2013, which a node's start does not
  # retry (MysqlClientErrorCode).
  depends_on:
    online-testing-cluster-proxy:
      condition: service_healthy

x-node-env: &node-env
  # APP_ENV is required of every node (HIL-566), and the value is `dev`, not `test`:
  # `dev` is not production-like, so the nodes admit the test-only commands this
  # harness drives, and the framework's cluster probes start only on a clustered
  # node of a non-production environment. Only the cli container runs as
  # APP_ENV=test, and no env file can point a container of this stand at a database
  # of its own anyway — every one of them names the same DB_DATABASE.
  APP_ENV: dev
  DB_HOST: online-testing-cluster-proxy
  DB_PORT: "3306"
  # One schema for the whole stand, nodes and CLI alike: the cluster model is
  # "one database per cluster", and a node that cannot see its neighbour's row
  # cannot be asked about it (HIL-712).
  DB_DATABASE: hilos-demo-online-testing-cluster
  DB_USERNAME: hilos
  DB_PASSWORD: hilos_pass
  HTTP_STATUS_HOST: 0.0.0.0
  HTTP_STATUS_PORT: "8090"
  WORKER_COMM_HOST: 0.0.0.0
  WORKER_COMM_PORT: "8091"
  COMMAND_HOST: 0.0.0.0
  COMMAND_PORT: "8094"
  # The demo has pages, so a node refuses to start without its WebSocket listener; bound in the
  # container at the port every demo uses, and published nowhere - no browser reaches this stand.
  WEBSOCKET_HOST: 0.0.0.0
  WEBSOCKET_PORT: "8092"
  # Every node addresses itself, so an operator command run with `docker exec` in
  # any node's container (admin:create / admin:grant / admin:revoke /
  # protected-mode:open, and the harness's test:cluster:inspect) reaches that
  # node's command channel over loopback.
  HILOS_DAEMON_HOST: 127.0.0.1
  CLUSTER_ENABLED: "true"
  CLUSTER_PEER_HOST: 0.0.0.0
  CLUSTER_PEER_PORT: "8095"
  CLUSTER_MASTER_SET: "m1,m2,m3"
  # CLUSTER_SEEDS is set PER NODE below, each excluding the node's own advertise
  # address: a node must never dial itself (the self-link collapse tears the daemon
  # down). Gossip admits every other peer from any one live seed.
  CLUSTER_ELECTION_TIMEOUT_MIN_MS: "1500"
  CLUSTER_ELECTION_TIMEOUT_MAX_MS: "3000"
  CLUSTER_HEARTBEAT_INTERVAL_MS: "500"
  CLUSTER_LINK_KEEPALIVE_INTERVAL_MS: "1000"
  CLUSTER_LINK_TIMEOUT_MS: "6000"
  CLUSTER_FAILOVER_GRACE_MS: "6000"
  CLUSTER_SLAVE_WORK_GRACE_MS: "4000"
  # Every link between nodes is mutual TLS (HIL-1034): each node trusts the stand's authority
  # and presents its own certificate, set per node below as CLUSTER_TLS_CERT_FILE. The files in
  # docker/tls/ are stand fixtures issued by the framework's cluster:tls:* commands against an
  # authority of this stand alone; how to reissue them is in demo/online-testing/README.md.
  CLUSTER_TLS_CA_FILE: /app/docker/tls/ca.pem
  # Every node carries placed work here, so every node takes the pools binance gives its
  # slaves — the fleet shares the regular workers, and after a partition one master may hold
  # all of it; one warm monopolistic worker per node with placed work
  # (docs/new-project/README.md, "Worker pool").
  WORKER_MIN_REGULAR: "5"
  WORKER_MAX_REGULAR: "5"
  WORKER_MIN_MONOPOLISTIC: "1"

# One member of the stand's database. The merge key copies the top level only: a service that
# sets labels or volumes of its own lists them whole.
x-galera-base: &galera-base
  image: mariadb:11.4
  restart: "no"
  environment:
    MYSQL_ROOT_PASSWORD: hilos_root_pass
    MYSQL_DATABASE: hilos-demo-online-testing-cluster
    MYSQL_USER: hilos
    MYSQL_PASSWORD: hilos_pass
    TZ: UTC
    # mysql@localhost over unix_socket, with no grant beyond USAGE: the user the health check
    # below signs in as. The image creates it only when asked.
    MARIADB_MYSQL_LOCALHOST_USER: "1"
  labels:
    hilos.database.member: "true"
  # Synced is what a member owes before anything leans on it. Not the image's healthcheck user:
  # its password is random on each member (/var/lib/mysql/.my-healthcheck.cnf) and SST brings the
  # donor's user table, so the two part; mysql@localhost is created on every member and travels
  # with SST.
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--su-mysql", "--no-defaults", "--connect", "--galera_online"]
    interval: 2s
    timeout: 5s
    retries: 60
    start_period: 20s

services:
  online-testing-cluster-galera1:
    <<: *galera-base
    container_name: online-testing-cluster-galera1
    # How the runner's artifact collector finds the database: the stands spell their database
    # service several ways, so it is asked for by role rather than guessed at by name (HIL-841).
    # And the one member the tooling execs into — db-sql and the step's artifact collector; any
    # member would answer the same, one keeps the answer off docker's listing order.
    labels:
      hilos.role: database
      hilos.database.member: "true"
    # Raises the cluster when no other member answers, joins it otherwise (docker/galera/bootstrap.sh).
    entrypoint: ["bash", "/usr/local/bin/hilos-galera-bootstrap.sh"]
    command: ["mariadbd", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--wsrep-node-name=galera1", "--wsrep-node-address=10.223.0.21"]
    volumes:
      - ./galera/galera.cnf:/etc/mysql/conf.d/zz-galera.cnf:ro
      - ./galera/bootstrap.sh:/usr/local/bin/hilos-galera-bootstrap.sh:ro
      - galera1-data:/var/lib/mysql
    networks:
      cluster-net:
        ipv4_address: 10.223.0.21

  # Joins, never bootstraps; waits for galera1 so that two joiners do not pull a full copy from
  # one donor at once.
  online-testing-cluster-galera2:
    <<: *galera-base
    container_name: online-testing-cluster-galera2
    depends_on:
      online-testing-cluster-galera1:
        condition: service_healthy
    command: ["mariadbd", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--wsrep-node-name=galera2", "--wsrep-node-address=10.223.0.22"]
    volumes:
      - ./galera/galera.cnf:/etc/mysql/conf.d/zz-galera.cnf:ro
      - galera2-data:/var/lib/mysql
    networks:
      cluster-net:
        ipv4_address: 10.223.0.22

  # The same as galera2, after it; see the comment there.
  online-testing-cluster-galera3:
    <<: *galera-base
    container_name: online-testing-cluster-galera3
    depends_on:
      online-testing-cluster-galera2:
        condition: service_healthy
    command: ["mariadbd", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--wsrep-node-name=galera3", "--wsrep-node-address=10.223.0.23"]
    volumes:
      - ./galera/galera.cnf:/etc/mysql/conf.d/zz-galera.cnf:ro
      - galera3-data:/var/lib/mysql
    networks:
      cluster-net:
        ipv4_address: 10.223.0.23

  # The ONE address of the database — the nodes and the cli know only this. Hilos sees one
  # database address (2026-09-06), and the topology behind it is the project's.
  online-testing-cluster-proxy:
    image: haproxy:3.4-alpine
    container_name: online-testing-cluster-proxy
    restart: "no"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      online-testing-cluster-galera1:
        condition: service_healthy
      online-testing-cluster-galera2:
        condition: service_healthy
      online-testing-cluster-galera3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      cluster-net:
        ipv4_address: 10.223.0.10

  online-testing-cluster-m1:
    <<: *node-base
    container_name: online-testing-cluster-m1
    # Found by role for the same reason the database is (HIL-841), and carried by m1 ALONE:
    # the three nodes share one schema (HIL-712), the collector takes the first container
    # wearing the label, and putting it on all three would make which of them answers a
    # matter of the order docker happened to list them in.
    labels:
      hilos.role: app
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: m1
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/m1.pem
      CLUSTER_NODE_ROLE: master
      # Every master carries placed work on this stand — `worker` is the tag the probe fleet
      # asks of its host, and a node that declares no key=value takes no placed work at all
      # (HIL-445, rule 4); the three declare the same because they are equal, and the leader is
      # still last among them (rule 3), so the fleet lives on the two that do not lead until a
      # re-election hands the leader what it carried.
      CLUSTER_NODE_CAPABILITIES: "worker,ram=10"
      CLUSTER_PEER_ADVERTISE: "10.223.0.11:8095"
      CLUSTER_SEEDS: "10.223.0.12:8095,10.223.0.13:8095"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/m1:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.223.0.11

  online-testing-cluster-m2:
    <<: *node-base
    container_name: online-testing-cluster-m2
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: m2
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/m2.pem
      CLUSTER_NODE_ROLE: master
      # The same as m1's, and for the same reasons; see the comment there.
      CLUSTER_NODE_CAPABILITIES: "worker,ram=10"
      CLUSTER_PEER_ADVERTISE: "10.223.0.12:8095"
      CLUSTER_SEEDS: "10.223.0.11:8095,10.223.0.13:8095"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/m2:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.223.0.12

  online-testing-cluster-m3:
    <<: *node-base
    container_name: online-testing-cluster-m3
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: m3
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/m3.pem
      CLUSTER_NODE_ROLE: master
      # The same as m1's, and for the same reasons; see the comment there.
      CLUSTER_NODE_CAPABILITIES: "worker,ram=10"
      CLUSTER_PEER_ADVERTISE: "10.223.0.13:8095"
      CLUSTER_SEEDS: "10.223.0.11:8095,10.223.0.12:8095"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/m3:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.223.0.13

  # Long-lived CLI container the harness `docker exec`s for test:cluster:inspect,
  # and the one-shot runner for the harness's own chores (profile cli, so it never
  # joins a cluster bring-up implicitly). Deliberately WITHOUT HILOS_DAEMON_HOST:
  # unlike the demo's other cli services, which face one daemon, this one addresses
  # three nodes in turn, so the caller names the node (`docker exec -e
  # HILOS_DAEMON_HOST=<ip>`): the shared harness names the node per call.
  online-testing-cluster-cli:
    build: .
    container_name: online-testing-cluster-cli
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      APP_ENV: test
      DB_HOST: online-testing-cluster-proxy
      DB_PORT: "3306"
      # Not inherited: this service carries no anchor. Same schema as the nodes
      # (HIL-712).
      DB_DATABASE: hilos-demo-online-testing-cluster
      DB_USERNAME: hilos
      DB_PASSWORD: hilos_pass
      COMMAND_PORT: "8094"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    depends_on:
      online-testing-cluster-proxy:
        condition: service_healthy
    profiles:
      - cli
    networks:
      - cluster-net

volumes:
  galera1-data:
    name: hilos-online-testing-cluster-galera1-data
  galera2-data:
    name: hilos-online-testing-cluster-galera2-data
  galera3-data:
    name: hilos-online-testing-cluster-galera3-data

networks:
  cluster-net:
    name: hilos-online-testing-cluster-net
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 — Docker's default
        # address pools. The nodes need fixed addresses (peers advertise them, and
        # `cluster heal` reconnects a partitioned node on its original IP), so this
        # subnet is claimed, not assigned. Inside a default pool that claim loses a
        # race: any other stack whose network came up first may already hold the
        # range, and then the whole cluster fails to start with "Pool overlaps with
        # other one on this address space". 10.0.0.0/8 is never auto-assigned.
        - subnet: 10.223.0.0/16
