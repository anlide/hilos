# Standalone MariaDB, also extended by the local stand. No Hilos-node dependency.
services:
  database:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mariadb:11.4
    # How the runner's artifact collector finds this container: the stands spell their
    # database service several ways, so it is asked for by role rather than guessed at by
    # name (HIL-841).
    labels:
      hilos.role: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-hilos-demo-binance-btc-tracker-cluster}
      MYSQL_USER: ${DB_USERNAME:-hilos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hilos_pass}
      TZ: UTC
    volumes:
      # Host memory keeps this member's data across down/up and kill/start;
      # the harness wipes it on down --volumes (HIL-1327).
      - ${HILOS_CLUSTER_DB_DATA_DIR:-/dev/shm/hilos-binance-btc-tracker-cluster-mysql-data${HILOS_STAND_SUFFIX:-}}:/var/lib/mysql
      - ../../../../framework/docker/mysql/test-stand.cnf:/etc/mysql/conf.d/zz-hilos-test-stand.cnf:ro
      - ../mysql/init-change-log.sh:/docker-entrypoint-initdb.d/init-change-log.sh:ro
      - ../mysql/provision-change-log.sh:/usr/local/bin/provision-change-log.sh:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "${HILOS_CLUSTER_BIND_ADDRESS:-127.0.0.1}:${HILOS_CLUSTER_DB_PUBLISHED_PORT:-3306}:3306"
