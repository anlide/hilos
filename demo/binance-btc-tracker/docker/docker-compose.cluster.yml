# The cluster stand of binance-btc-tracker (HIL-1215): three masters, two slaves and a
# stranger on one database.
#
# One shared MariaDB carrying the primary and its derived journal for the whole stand — the model
# Hilos is built on, and what makes "node A writes a row, node B reads it" sayable —
# five daemon nodes that roll that schema out themselves as they start together,
# under the rollout claim in the database (HIL-1228), on a dedicated bridge with
# static IPs — three masters (the consensus/master-set) and two data-plane slaves
# (the placement targets) — and a long-lived CLI container the shared cluster harness
# `docker exec`s to run `test:cluster:inspect` against each node. Node role, identity, capabilities,
# master set, and timeouts all come from CLUSTER_* env, so the same image is a
# master or a data-plane node purely by configuration.
#
# A compose project of its own, beside the demo's local and test stacks rather than inside
# one of them: the demo's e2e steps take their whole project down when they start, and a
# fleet inside it would fall in the middle of its matrix. The nodes run the whole demo —
# every agent it registers, the framework's cluster probes among them — and publish nothing
# on the host: the harness reaches them through the cli container. One nginx entry
# serves all masters on the stand network; hilos_stand_master selects a master,
# while a request without that cookie rotates through them.
# The cluster-directory key below names the demo's shared $fs directory on this stand.
# The e2e profile adds Mailpit and a one-shot Playwright runner; `cluster.py e2e`
# raises them, and the browser enters through the one entry above, naming its
# master by the cookie (HIL-1232).

name: hilos-binance-btc-tracker-cluster${HILOS_STAND_SUFFIX:-}

# What the shared cluster harness (framework/docker/cluster/cluster.py) reads besides the services
# in the included model; node identity, addresses, roles, room and logs come from its services.
x-hilos-cluster:
  cli: binance-btc-tracker-cluster-cli
  entry: binance-btc-tracker-cluster-entry
  stranger: x1
  # FsContext::DATA_EXPORT lives at /app/data/data_export. Scenario 29 gives one node an
  # empty copy of its own; scenario 30 looks for a data export copy in the shared directory.
  cluster-directory:
    name: data_export
    path: /app/data/data_export
  scenarios: [1, 2, 5, 7, 8, 10, 13, 17, 20, 23, 25, 29, 30, 32, 33, 34, 35, 36, 38, 41, 42, 44, 45, 46]
  e2e:
    runner: binance-btc-tracker-cluster-e2e-runner
    daemon: true


# One included model: merge local services and tooling before importing shared resources.
include:
  - path: [./cluster/local.yml, ./cluster/tooling.yml]
