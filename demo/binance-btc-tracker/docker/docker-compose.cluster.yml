# The cluster stand of binance-btc-tracker (HIL-1215): three masters, two slaves and a
# stranger on one database.
#
# One shared MariaDB carrying ONE schema for the whole stand (HIL-712) — the model
# Hilos is built on, and what makes "node A writes a row, node B reads it" sayable —
# five daemon nodes that roll that schema out themselves as they start together,
# under the rollout claim in the database (HIL-1228), on a dedicated bridge with
# static IPs — three masters (the consensus/master-set) and two data-plane slaves
# (the placement targets) — and a long-lived CLI container the shared cluster harness
# `docker exec`s to run `test:cluster:inspect` against each node. Node role, identity, capabilities,
# master set, and timeouts all come from CLUSTER_* env, so the same image is a
# master or a data-plane node purely by configuration.
#
# A compose project of its own, beside the demo's local and test stacks rather than inside
# one of them: the demo's e2e steps take their whole project down when they start, and a
# fleet inside it would fall in the middle of its matrix. The nodes run the whole demo —
# every agent it registers, the framework's cluster probes among them — and publish nothing
# on the host: the harness reaches them through the cli container.

name: hilos-binance-btc-tracker-cluster

# What the shared cluster harness (framework/docker/cluster/cluster.py) reads besides the services
# below; the nodes, their addresses, roles, room and log directories it takes from the services.
x-hilos-cluster:
  cli: binance-btc-tracker-cluster-cli
  stranger: x1
  scenarios: [1, 2, 5, 7, 8, 10, 13, 17, 20]

x-node-base: &node-base
  build: .
  restart: "no"
  command: ["php", "backend/Bootstrap/docker.php"]
  depends_on:
    binance-btc-tracker-cluster-mysql:
      condition: service_healthy

x-node-env: &node-env
  # APP_ENV is required of every node (HIL-566), and the value is `dev`, not `test`:
  # `dev` is not production-like, so the nodes admit the test-only commands this
  # harness drives, and the framework's cluster probes start only on a clustered
  # node of a non-production environment. Only the cli container runs as
  # APP_ENV=test, and no env file can point a container of this stand at a database
  # of its own anyway — every one of them names the same DB_DATABASE.
  APP_ENV: dev
  DB_HOST: binance-btc-tracker-cluster-mysql
  DB_PORT: "3306"
  # One schema for the whole stand, nodes and CLI alike: the cluster model is
  # "one database per cluster", and a node that cannot see its neighbour's row
  # cannot be asked about it (HIL-712).
  DB_DATABASE: hilos-demo-binance-btc-tracker-cluster
  DB_USERNAME: hilos
  DB_PASSWORD: hilos_pass
  HTTP_STATUS_HOST: 0.0.0.0
  HTTP_STATUS_PORT: "8090"
  WORKER_COMM_HOST: 0.0.0.0
  WORKER_COMM_PORT: "8091"
  COMMAND_HOST: 0.0.0.0
  COMMAND_PORT: "8094"
  # The demo has pages, so a node refuses to start without its WebSocket listener; bound in the
  # container at the port every demo uses, and published nowhere - no browser reaches this stand
  # yet, and scenario 10 attaches its browser through the CLI.
  WEBSOCKET_HOST: 0.0.0.0
  WEBSOCKET_PORT: "8092"
  # Every node addresses itself, so an operator command run with `docker exec` in
  # any node's container (admin:create / admin:grant / admin:revoke /
  # protected-mode:open, and the harness's test:cluster:inspect) reaches that
  # node's command channel over loopback.
  HILOS_DAEMON_HOST: 127.0.0.1
  CLUSTER_ENABLED: "true"
  CLUSTER_PEER_HOST: 0.0.0.0
  CLUSTER_PEER_PORT: "8095"
  CLUSTER_MASTER_SET: "m1,m2,m3"
  # CLUSTER_SEEDS is set PER NODE below, each excluding the node's own advertise
  # address: a node must never dial itself (the self-link collapse tears the daemon
  # down). Gossip admits every other peer from any one live seed.
  CLUSTER_ELECTION_TIMEOUT_MIN_MS: "1500"
  CLUSTER_ELECTION_TIMEOUT_MAX_MS: "3000"
  CLUSTER_HEARTBEAT_INTERVAL_MS: "500"
  CLUSTER_LINK_KEEPALIVE_INTERVAL_MS: "1000"
  CLUSTER_LINK_TIMEOUT_MS: "6000"
  CLUSTER_FAILOVER_GRACE_MS: "6000"
  CLUSTER_SLAVE_WORK_GRACE_MS: "4000"
  # Every link between nodes is mutual TLS (HIL-1034): each node trusts the stand's authority
  # and presents its own certificate, set per node below as CLUSTER_TLS_CERT_FILE. The files in
  # docker/tls/ are stand fixtures issued by the framework's cluster:tls:* commands against an
  # authority of this stand alone; how to reissue them is in demo/binance-btc-tracker/README.md.
  CLUSTER_TLS_CA_FILE: /app/docker/tls/ca.pem
  WORKER_MIN_REGULAR: "1"
  WORKER_MAX_REGULAR: "1"
  WORKER_MIN_MONOPOLISTIC: "1"

services:
  binance-btc-tracker-cluster-mysql:
    image: mariadb:11.4
    container_name: binance-btc-tracker-cluster-mysql
    # How the runner's artifact collector finds this container: the stands spell their
    # database service several ways, so it is asked for by role rather than guessed at by
    # name (HIL-841).
    labels:
      hilos.role: database
    environment:
      MYSQL_ROOT_PASSWORD: hilos_root_pass
      MYSQL_DATABASE: hilos-demo-binance-btc-tracker-cluster
      MYSQL_USER: hilos
      MYSQL_PASSWORD: hilos_pass
      TZ: UTC
    volumes:
      - mysql-cluster-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      cluster-net:
        ipv4_address: 10.221.0.10

  binance-btc-tracker-cluster-m1:
    <<: *node-base
    container_name: binance-btc-tracker-cluster-m1
    # Found by role for the same reason the database is (HIL-841), and carried by m1 ALONE:
    # the five nodes share one schema (HIL-712), the collector takes the first container
    # wearing the label, and putting it on all five would make which of them answers a
    # matter of the order docker happened to list them in.
    labels:
      hilos.role: app
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: m1
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/m1.pem
      CLUSTER_NODE_ROLE: master
      # Empty on purpose: the framework gates placement on what a node DECLARES, never on its
      # role (HIL-445). An empty string declares no capacity, and a node with no key=value
      # accepts NO placed work by rule (HIL-448) - no fleet member, no policy-placed agent of
      # this demo, nothing the policy places. The per-node agents (AgentScope::NODE) - the
      # runtime-set probe among them - are not placed and need no capacity, so they still run
      # here. The decision and what follows from it:
      # docs/agents/architecture/daemon-lifecycle.md, "Who may carry placed work (HIL-445)"
      # and "Consumable capacity and agent cost (HIL-448)".
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.221.0.11:8095"
      CLUSTER_SEEDS: "10.221.0.12:8095,10.221.0.13:8095,10.221.0.14:8095,10.221.0.15:8095"
      WORKER_MIN_MONOPOLISTIC: "0"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/m1:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.221.0.11

  binance-btc-tracker-cluster-m2:
    <<: *node-base
    container_name: binance-btc-tracker-cluster-m2
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: m2
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/m2.pem
      CLUSTER_NODE_ROLE: master
      # Empty for the same reason m1's is; see the comment there.
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.221.0.12:8095"
      CLUSTER_SEEDS: "10.221.0.11:8095,10.221.0.13:8095,10.221.0.14:8095,10.221.0.15:8095"
      WORKER_MIN_MONOPOLISTIC: "0"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/m2:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.221.0.12

  binance-btc-tracker-cluster-m3:
    <<: *node-base
    container_name: binance-btc-tracker-cluster-m3
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: m3
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/m3.pem
      CLUSTER_NODE_ROLE: master
      # Empty for the same reason m1's is; see the comment there.
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.221.0.13:8095"
      CLUSTER_SEEDS: "10.221.0.11:8095,10.221.0.12:8095,10.221.0.14:8095,10.221.0.15:8095"
      WORKER_MIN_MONOPOLISTIC: "0"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/m3:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.221.0.13

  binance-btc-tracker-cluster-s1:
    <<: *node-base
    container_name: binance-btc-tracker-cluster-s1
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: s1
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/s1.pem
      CLUSTER_NODE_ROLE: slave
      # `worker` is the tag the probe fleet asks of its host. The ram is there so the node
      # takes placed work at all: a node that declares no key=value accepts none (HIL-445,
      # rule 4), and without it neither the fleet nor this demo's policy-placed agents would
      # land anywhere. Nothing on this stand spends ram, so both slaves declare the same;
      # unequal room is the shape of ecommerce-shop's stand.
      CLUSTER_NODE_CAPABILITIES: "worker,ram=10"
      CLUSTER_PEER_ADVERTISE: "10.221.0.14:8095"
      CLUSTER_SEEDS: "10.221.0.11:8095,10.221.0.12:8095,10.221.0.13:8095,10.221.0.15:8095"
      # Fleet members share these regular workers. A member's synthetic job blocks its
      # worker, so several of them keep the whole fleet ticking even when one node holds
      # it all after a failover.
      WORKER_MIN_REGULAR: "5"
      WORKER_MAX_REGULAR: "5"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/s1:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.221.0.14

  binance-btc-tracker-cluster-s2:
    <<: *node-base
    container_name: binance-btc-tracker-cluster-s2
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: s2
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/s2.pem
      CLUSTER_NODE_ROLE: slave
      # The same as s1's, and for the same reasons; see the comment there.
      CLUSTER_NODE_CAPABILITIES: "worker,ram=10"
      CLUSTER_PEER_ADVERTISE: "10.221.0.15:8095"
      CLUSTER_SEEDS: "10.221.0.11:8095,10.221.0.12:8095,10.221.0.13:8095,10.221.0.14:8095"
      # Regular workers the fleet members share on this node; see s1.
      WORKER_MIN_REGULAR: "5"
      WORKER_MAX_REGULAR: "5"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/s2:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.221.0.15

  # A stranger on the cluster network (HIL-1034): a node whose certificate is signed by an
  # authority the cluster does not trust. It passes its own start-up check - its trust file is
  # that other authority - and dials every node, and every link is refused on both ends:
  # scenario 17 asserts that nobody admits it. Profile `stranger`, so it never comes up with
  # the cluster; the shared harness's `stranger up|down` drives it. Not in CLUSTER_MASTER_SET.
  binance-btc-tracker-cluster-x1:
    <<: *node-base
    container_name: binance-btc-tracker-cluster-x1
    profiles:
      - stranger
    environment:
      <<: *node-env
      CLUSTER_NODE_ID: x1
      CLUSTER_TLS_CERT_FILE: /app/docker/tls/x1.pem
      CLUSTER_TLS_CA_FILE: /app/docker/tls/stranger-ca.pem
      CLUSTER_NODE_ROLE: slave
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.221.0.16:8095"
      CLUSTER_SEEDS: "10.221.0.11:8095,10.221.0.12:8095,10.221.0.13:8095,10.221.0.14:8095,10.221.0.15:8095"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-cluster/x1:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.221.0.16

  # Long-lived CLI container the harness `docker exec`s for test:cluster:inspect,
  # and the one-shot runner for the harness's own chores (profile cli, so it never
  # joins a cluster bring-up implicitly). Deliberately WITHOUT HILOS_DAEMON_HOST:
  # unlike the demo's other cli services, which face one daemon, this one addresses
  # five nodes in turn, so the caller names the node (`docker exec -e
  # HILOS_DAEMON_HOST=<ip>`): the shared harness names the node per call.
  binance-btc-tracker-cluster-cli:
    build: .
    container_name: binance-btc-tracker-cluster-cli
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      APP_ENV: test
      DB_HOST: binance-btc-tracker-cluster-mysql
      DB_PORT: "3306"
      # Not inherited: this service carries no anchor. Same schema as the nodes
      # (HIL-712).
      DB_DATABASE: hilos-demo-binance-btc-tracker-cluster
      DB_USERNAME: hilos
      DB_PASSWORD: hilos_pass
      COMMAND_PORT: "8094"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    depends_on:
      binance-btc-tracker-cluster-mysql:
        condition: service_healthy
    profiles:
      - cli
    networks:
      - cluster-net

volumes:
  mysql-cluster-data:
    name: hilos-binance-btc-tracker-cluster-mysql-data

networks:
  cluster-net:
    name: hilos-binance-btc-tracker-cluster-net
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 — Docker's default
        # address pools. The nodes need fixed addresses (peers advertise them, and
        # `cluster heal` reconnects a partitioned node on its original IP), so this
        # subnet is claimed, not assigned. Inside a default pool that claim loses a
        # race: any other stack whose network came up first may already hold the
        # range, and then the whole cluster fails to start with "Pool overlaps with
        # other one on this address space". 10.0.0.0/8 is never auto-assigned.
        - subnet: 10.221.0.0/16
