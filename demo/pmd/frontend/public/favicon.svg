<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">PMD — letter P</title>
  <desc id="desc">A white letter P on a brown rounded square. In the bottom-right corner, a plain blue dot.</desc>
  <!-- HIL-2151: the small sign of the pmd demo.
       Redrawn in HIL-2261 with the mark in the bottom-right corner.
       Symbol: demo/pmd/frontend/public/favicon.svg.
       Corner mark: the Hilos logo, original geometry. MIT; see ../README.md. -->
  <mask id="hilos-mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="25" cy="25" r="9" fill="#000"/>
  </mask>
  <g id="demo-symbol" fill="#A9682F" mask="url(#hilos-mark-gap)">
    <rect x="0" y="0" width="24" height="24" rx="4.5"/>
    <path fill="#FFFFFF" transform="matrix(0.75 0 0 0.75 0 0)" d="M10 25V7h7a6 6 0 0 1 0 12h-3v6zm4-10h3a2 2 0 0 0 0-4h-3z"/>
