# Docker Compose configuration for LOCAL development.
# The full dev stack runs in Docker: MySQL, phpMyAdmin, the daemon, and the
# Angular CLI dev server (poll-frontend-local, HMR). `composer run daemon-start`
# brings the whole stack up; the cli services (profile cli) run on-demand
# commands (see the composer scripts).
#
# Port plan: the daemon binds fixed in-container ports (8090 status / 8091
# worker comm / 8092 websocket, same as every demo — the nginx template proxies
# /ws to :8092); only the host-side publishes shift per demo so the stacks run
# side by side (chat holds 8090-8097, tasks 8098-8103, simple-poll takes
# 8104-8109 across this file and docker-compose.test.yml).
#
# Every ${...} below is compose *interpolation*, resolved before a container
# exists: it comes from the shell environment or from a `.env` next to this file
# (docker/.env), NEVER from the demo's ../.env — that one is wired as `env_file`
# and only reaches container environments. A host-port override written into
# ../.env is silently ignored, so keep the defaults here usable as-is.

name: hilos-simple-poll-local

services:
  # MySQL: inside the network use poll-mysql-local:3306. From host use
  # localhost:${MYSQL_HOST_PORT} (default 33065 — 33060-33064 belong to
  # chat-local, chat-test, the framework test stack, and tasks).
  poll-mysql-local:
    image: mariadb:11.4
    container_name: poll-mysql-local
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST in docker/.env to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-33065}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-simple-poll}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - TZ=UTC
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-simple-poll-local-network:
        ipv4_address: ${DOCKER_MYSQL_IP:-10.198.0.10}

  poll-phpmyadmin-local:
    image: phpmyadmin:latest
    container_name: poll-phpmyadmin-local
    environment:
      - PMA_HOST=poll-mysql-local
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=256M
    depends_on:
      - poll-mysql-local
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${PHPMYADMIN_PORT:-8082}:80"
    restart: unless-stopped
    networks:
      - hilos-simple-poll-local-network

  # Mail interceptor for the local stack, kept identical across the three demos so
  # a stack is never a special case (P-062). Its web UI is published on the host,
  # so a message is read where a person can see it. This demo mails nothing today
  # — it activates NOTIFICATIONS without NOTIFICATION_DELIVERY — so the catcher is
  # here for the day it does, and meanwhile it gives a stray message somewhere to
  # land other than the work tree.
  poll-mailpit-local:
    image: axllent/mailpit:v1.21
    container_name: poll-mailpit-local
    environment:
      # A local relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8027}:8025"
    restart: unless-stopped
    networks:
      - hilos-simple-poll-local-network

  # The stack's gateway for every non-mail channel (HIL-492, HIL-653): the daemon
  # points its SMS and Telegram transports here, and everything the gateway catches
  # it forwards to poll-mailpit-local as a letter. That is the whole point - a code
  # sent to a phone is read in the browser beside the mailed ones, instead of being
  # unreachable on a local stack. Not published on the host: it is talked to by the
  # daemon, and read through Mailpit's UI above.
  poll-stand-gateway-local:
    build:
      context: ../../../framework/docker/stand-gateway
    container_name: poll-stand-gateway-local
    environment:
      MAILPIT_SMTP_HOST: poll-mailpit-local
      MAILPIT_SMTP_PORT: 1025
      TZ: UTC
    depends_on:
      - poll-mailpit-local
    restart: unless-stopped
    networks:
      - hilos-simple-poll-local-network

  # The Hilos daemon. The .env file is optional at the compose level: nothing
  # creates it for you, and a fresh checkout starts without one - the values
  # come from this stack and, for anything it does not name, from .env.example.
  poll-daemon-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: poll-daemon-local
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=local
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: the websocket port below is published
      # as well, and a connection that reaches it without passing through nginx
      # arrives from the docker network's gateway - a peer that must never be
      # trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_NGINX_IP:-10.198.0.12}/32
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke / protected-mode:open speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - DB_HOST=${DB_HOST:-poll-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-simple-poll}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      # Nine monopolistic workers: the poll agent, the Hilos dashboard's hilos_index
      # agent the shell gear subscribes, the sessions library that resolves every
      # handshake (HIL-710), the notifications library that owns the notification
      # tables (HIL-771), and the three sign-in brought (HIL-634) - the users
      # library, the OAuth agent and the code agent - and the two the logs feature
      # brings (HIL-393): the hilos_logs agent every screen of the section
      # subscribes, and the per-node hilos_log_store that reads the files. A
      # monopolistic singleton needs a worker of its own, so the pool is the agent
      # count: one short and a handshake or a sign-in is addressed to an agent that
      # never comes up - the daemon throws NoSuitableWorkerException at the moment
      # of the start and dies, because it cannot wait for one more worker to be
      # forked. The pooled delivery channels (mail, SMS) and the node-scoped
      # throttle agent are NOT among them - they run on regular workers. The
      # framework default gives two, but the demos prescribe it here (like chat) so
      # the pool is explicit and not at the mercy of env drift.
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-10}
      # Mail goes to the stack's own interceptor, whose UI is published above. The
      # transport is pinned rather than auto-selected: a stack that loses the
      # catcher should fail loudly, not fall back to writing .eml files nobody opens.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-poll-mailpit-local}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-notifications@poll.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Hilos Poll}
      # SMS and Telegram go to the stack's own gateway, which mails them on to the
      # same interceptor (HIL-653). A non-empty SMS endpoint is what picks the
      # generic HTTP provider over the stub, so the message really travels; the
      # Telegram token is fake but non-empty, because the gateway refuses a call
      # that carries no bearer and a daemon without credentials should fail here.
      - SMS_ENDPOINT_URL=${SMS_ENDPOINT_URL:-http://poll-stand-gateway-local:18000/sms/send}
      - TELEGRAM_GATEWAY_ENDPOINT_URL=${TELEGRAM_GATEWAY_ENDPOINT_URL:-http://poll-stand-gateway-local:18000/telegram}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-stand-gateway-token}
      - TELEGRAM_GATEWAY_SENDER_USERNAME=${TELEGRAM_GATEWAY_SENDER_USERNAME:-HilosPoll}
      # Where a mailed sign-in link comes back to (HIL-417). Overridden rather than
      # inherited: the framework default names port 5173, and this stack publishes
      # its dev server on 5175 so it can run beside the chat and tasks ones - so the
      # default would mail a person a link into another application's front end.
      - HILOS_MAGIC_LINK_URL=${HILOS_MAGIC_LINK_URL:-http://localhost:5175/auth/magic}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - poll-mysql-local
      - poll-mailpit-local
      - poll-stand-gateway-local
    ports:
      # Host-side publishes: container ports stay fixed, the host side shifts
      # per the demo port plan so several stacks run side by side.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${HTTP_STATUS_HOST_PORT:-8104}:8090"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WORKER_COMM_HOST_PORT:-8105}:8091"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WEBSOCKET_HOST_PORT:-8106}:8092"
    restart: unless-stopped
    networks:
      hilos-simple-poll-local-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-10.198.0.11}

  poll-cli-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: poll-cli-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=local
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-10.198.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
      - DB_HOST=${DB_HOST:-poll-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-simple-poll}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      - poll-mysql-local
    networks:
      - hilos-simple-poll-local-network

  # Prod-parity nginx over the BUILT frontend artifact (profile full — only
  # `daemon-start-build` starts it; the dev loop uses the ng dev server instead).
  # Run `composer run frontend:build` first: this mounts frontend/dist read-only,
  # and docker would otherwise create it empty and serve 404s.
  poll-nginx-local:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: poll-nginx-local
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-local:/etc/nginx/ssl
    ports:
      # HTTPS only, on a high port. The former 443+n scheme (this demo had 445)
      # is unusable on a Windows host: SMB owns 445, so Docker Desktop rejects
      # the publish with "/forwards/expose returned unexpected status: 500" and
      # leaves the container created but never started. The container's own :80
      # vhost stays unpublished on purpose — it 301s to https://$host with the
      # port dropped, which lands on whatever holds 443 (another demo's stack),
      # not here. Reach this stack at https://localhost:8445.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_HTTPS_PORT:-8445}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=poll-daemon-local
    depends_on:
      - poll-daemon-local
    restart: unless-stopped
    profiles:
      - full
    networks:
      hilos-simple-poll-local-network:
        ipv4_address: ${DOCKER_NGINX_IP:-10.198.0.12}

  # Angular CLI dev server (`ng serve`, Vite-based under the hood) with HMR for
  # the simple-poll frontend. Mounts the whole repo at /hilos so the
  # @hilos/angular `file:` symlink into framework/frontend resolves, and runs
  # npm install first so a fresh checkout or an SDK re-vendor is picked up.
  # Native WSL2 filesystem events drive HMR — no polling
  # (docs/agents/frontend/build-and-docker.md). The host port defaults away
  # from the chat demo's 5173 and the tasks demo's 5174 so the local
  # stacks can run side by side. Angular has no import.meta.env mechanism, so
  # instead of a VITE_WS_URL override the dev server proxies the app's
  # same-origin /ws to the daemon (frontend/proxy.conf.json).
  poll-frontend-local:
    image: node:22-bookworm-slim
    container_name: poll-frontend-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/simple-poll/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: sh -c "npm install && npm run dev"
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${FRONTEND_DEV_PORT:-5175}:5173"
    restart: unless-stopped
    networks:
      - hilos-simple-poll-local-network

  # On-demand Node toolchain for the simple-poll frontend (npm install / build /
  # check). Profile cli so it never starts with the stack — invoked per command
  # via `run --rm` (see the composer frontend:* scripts).
  poll-frontend-cli-local:
    image: node:22-bookworm-slim
    container_name: poll-frontend-cli-local
    volumes:
      - ../../..:/hilos
      # A private Angular disk cache, mounted over the repo copy. `.angular/cache`
      # is an lmdb database owned by the long-lived dev server
      # (poll-frontend-local); lmdb opened from two containers at once corrupts
      # its reader lock table (PID namespaces overlap) and crashes ng build.
      # Keeping the two apart lets this container keep the cache ENABLED, which
      # is worth ~35% of `ng build` (measured: 6.3s -> 3.7-4.1s of builder time).
      # The "node_modules never in a named volume" rule does not apply: a build
      # cache is neither source nor a dependency, and the IDE never resolves
      # through it.
      - ng-cache-cli-local:/hilos/demo/simple-poll/frontend/.angular
    working_dir: /hilos/demo/simple-poll/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - cli
    networks:
      - hilos-simple-poll-local-network

volumes:
  nginx-ssl-local:
  ng-cache-cli-local:

networks:
  hilos-simple-poll-local-network:
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 - Docker's default
        # address pools. nginx needs a fixed address (the daemon trusts it by that
        # address and nothing else), so this subnet is claimed, not assigned. Inside
        # a default pool that claim loses a race: any other stack whose network came
        # up first may already hold the range, and then the stand fails to start with
        # "Pool overlaps with other one on this address space". 10.0.0.0/8 is never
        # auto-assigned (demo/cluster/docker/docker-compose.cluster.yml).
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.198.0.0/16}
