# Docker Compose configuration for tests (unit, Playwright e2e)
# Isolated from the local stack (different ports, volumes, network).
#
# e2e runs against the BUILT frontend artifact served by
# file-gallery-manager-nginx-test with a booted daemon behind it
# (docs/agents/frontend/testing-strategy.md). The e2e
# stack (mysql + daemon + nginx) starts via `composer run test:e2e-up`, then any
# number of `composer run test:e2e` invocations drive it, then `test:e2e-down`.
# Frontend services sit behind profiles so the PHP-only test commands never
# start them.

name: hilos-file-gallery-manager-test${HILOS_STAND_SUFFIX:-}

services:
  file-gallery-manager-mysql-test:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    container_name: file-gallery-manager-mysql-test${HILOS_STAND_SUFFIX:-}
    # How the runner's artifact collector finds this container: the three demos spell
    # their database service three different ways, so it is asked for by role rather
    # than guessed at by name, which would have broken silently on the fourth (HIL-841).
    labels:
      hilos.role: database
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST in docker/.env to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MYSQL_TEST_HOST_PORT:-33080}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-hilos-demo-file-gallery-manager-test}
      MYSQL_USER: ${MYSQL_USER:-hilos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hilos_pass}
      TZ: UTC
    # The test database lives in memory and goes with its container (HIL-1327).
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../../../framework/docker/mysql/test-stand.cnf:/etc/mysql/conf.d/zz-hilos-test-stand.cnf:ro
      # The change log journal's own database beside the primary (docs/agents/architecture/change-log.md).
      - ./mysql/provision-change-log.sh:/usr/local/bin/provision-change-log.sh:ro
      - ./mysql/init-change-log.sh:/docker-entrypoint-initdb.d/init-change-log.sh:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    # --connect alone: it waits for the TCP listener the init-time server never opens and
    # does not test the login, so neither the image's random healthcheck password (misread
    # when it starts and ends with a double quote) nor the age of the data directory can
    # keep this service unhealthy.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - hilos-file-gallery-manager-test-network

  # Registration and second-factor messages land in the stand mailbox.
  # No host ports: the runner reads Mailpit over this network.
  file-gallery-manager-mailpit-test:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: file-gallery-manager-mailpit-test${HILOS_STAND_SUFFIX:-}
    environment:
      # A test relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - hilos-file-gallery-manager-test-network

  file-gallery-manager-daemon-test:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../tests/.env
        required: false
    container_name: file-gallery-manager-daemon-test${HILOS_STAND_SUFFIX:-}
    # Found by role for the same reason the database is (HIL-841): the collector runs
    # this demo's own db:migration:status inside a container that is ALREADY up, never
    # starting one, because a stand it raised is no longer the stand that failed.
    labels:
      hilos.role: app
    volumes:
      - ..:/app
      # The stand's own data root: exports, backups, Status and files never share the local installation's data/ (docs/agents/testing.md).
      - ../data/test:/app/data
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-test:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=test
      # The nightly rotation carries daemon.log away under a run; a test that needs a rotation calls it itself.
      - LOG_ROTATION_CRON=0 3 29 2 *
      # The project zone the time-zone e2e stand on (HIL-1596). Pinned in the test
      # stack so a run reads the same zone whatever the host or a stale tests/.env
      # carries; the process value wins over the env file and /app/.env.
      - HILOS_PROJECT_TIME_ZONE=Europe/Warsaw
      - DB_HOST=file-gallery-manager-mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-file-gallery-manager-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      # The sign-in throttle off, as the test environment keeps it
      # (docs/agents/architecture/auth-throttle.md): every browser of a run signs
      # in from the runner's one address, so counters carried across the suite
      # would make a test depend on the ones before it. The process value wins
      # over a stale tests/.env. No spec of this demo proves the throttle;
      # binance-btc-tracker and ecommerce-shop keep it on for theirs.
      - HILOS_AUTH_THROTTLE_ENABLED=false
      - HILOS_DATA_EXPORT_XACCEL_LOCATION=/__hilos_data_export
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: the websocket port below is published
      # as well, and a connection that reaches it without passing through nginx
      # arrives from the docker network's gateway - a peer that must never be
      # trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_TEST_NGINX_IP:-10.${HILOS_STAND_NET_FILE_GALLERY_MANAGER:-217}.0.12}/32
      # The CLI command channel, the socket admin:grant / admin:revoke speak.
      # In-network only: the e2e runner shares the compose network, so no host
      # port is published.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - CLUSTER_NODE_NAME=Main node
      # Mail: the transport is pinned to the stand's own interceptor rather than
      # auto-selected, so a stand that loses the relay fails loudly instead of
      # quietly writing .eml files into the work tree that nobody reads. A sender
      # identity is mandatory — without it a message cannot be encoded at all.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=file-gallery-manager-mailpit-test
      - MAIL_SMTP_PORT=1025
      - MAIL_SMTP_SECURITY=none
      - MAIL_FROM_ADDRESS=notifications@file-gallery-manager.test
      - MAIL_FROM_NAME=Hilos File Gallery Manager
    command: ["php", "backend/Bootstrap/docker.php"]
    depends_on:
      file-gallery-manager-mysql-test:
        condition: service_healthy
      file-gallery-manager-mailpit-test:
        condition: service_healthy
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${HTTP_TEST_PORT:-8233}:8090"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WORKER_TEST_PORT:-8234}:8091"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WEBSOCKET_TEST_PORT:-8235}:8092"
    networks:
      - hilos-file-gallery-manager-test-network

  # On-demand Node toolchain for the file-gallery-manager frontend (npm install /
  # build / check). Mounts the whole repo at /hilos so the @hilos/react `file:`
  # dependency into framework/frontend resolves. Used by
  # `composer run test:e2e-build` to produce the dist that
  # file-gallery-manager-nginx-test serves.
  file-gallery-manager-frontend-cli-test:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: node:26.13.0-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
    container_name: file-gallery-manager-frontend-cli-test${HILOS_STAND_SUFFIX:-}
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/file-gallery-manager/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NODE_OPTIONS: "--no-experimental-webstorage"
    profiles:
      - cli
    # The stand's claimed network: without one, compose makes a <project>_default
    # from Docker's default pools on every run, and the stands exhaust them.
    networks:
      - hilos-file-gallery-manager-test-network

  # Serves the built frontend artifact over the same nginx image and config
  # template as prod (test what you ship) and proxies /ws to the daemon. The
  # e2e runner reaches it in-network as https://file-gallery-manager-nginx-test;
  # host ports are only for manual inspection.
  file-gallery-manager-nginx-test:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: file-gallery-manager-nginx-test${HILOS_STAND_SUFFIX:-}
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../data/test/data_export:/data_export:ro
      - nginx-ssl-test:/etc/nginx/ssl
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_TEST_HTTP_PORT:-8237}:80"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_TEST_HTTPS_PORT:-8238}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=file-gallery-manager-daemon-test
    depends_on:
      - file-gallery-manager-daemon-test
    profiles:
      - e2e
    networks:
      hilos-file-gallery-manager-test-network:
        ipv4_address: ${DOCKER_TEST_NGINX_IP:-10.${HILOS_STAND_NET_FILE_GALLERY_MANAGER:-217}.0.12}

  file-gallery-manager-cli-test:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../tests/.env
        required: false
    container_name: file-gallery-manager-cli-test${HILOS_STAND_SUFFIX:-}
    volumes:
      - ..:/app
      # The stand's own data root: exports, backups, Status and files never share the local installation's data/ (docs/agents/testing.md).
      - ../data/test:/app/data
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-test:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=test
      # The project zone the time-zone e2e stand on (HIL-1596). Pinned in the test
      # stack so a run reads the same zone whatever the host or a stale tests/.env
      # carries; the process value wins over the env file and /app/.env.
      - HILOS_PROJECT_TIME_ZONE=Europe/Warsaw
      # Where the daemon answers, so a command that writes state the daemon owns can ask
      # whether one is running before it starts (HIL-728). The check is fail-closed: without
      # this pair the CLI refuses such a command rather than risk a second writer, so
      # test:db-prepare needs it even though it runs before the daemon exists.
      - HILOS_DAEMON_HOST=file-gallery-manager-daemon-test
      - COMMAND_PORT=8094
      - DB_HOST=file-gallery-manager-mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-file-gallery-manager-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      file-gallery-manager-mysql-test:
        condition: service_healthy
    networks:
      - hilos-file-gallery-manager-test-network

  # Playwright e2e runner. The official image ships the browsers — its version
  # tag MUST match `@playwright/test` in tests/e2e/package.json, otherwise
  # Playwright cannot locate its browser executables. BASE_URL points at the
  # in-network nginx, so the run never depends on host ports. No depends_on:
  # the stack is started explicitly via `composer run test:e2e-up`, never as a
  # side effect of running tests. node_modules installs onto the host
  # bind-mount (docs/agents/frontend/build-and-docker.md).
  file-gallery-manager-e2e-runner:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    container_name: file-gallery-manager-e2e-runner${HILOS_STAND_SUFFIX:-}
    # The browser's scratch lives in memory: chromium runs with
    # --disable-dev-shm-usage, so its shared memory and profile churn land in
    # /tmp - gigabytes per suite written through the container layer to disk.
    tmpfs:
      - /tmp
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/file-gallery-manager/tests/e2e
    environment:
      BASE_URL: https://file-gallery-manager-nginx-test
      # The admin-gated /hilos specs take the grant over the daemon command
      # channel before they navigate (helpers/adminGrant.ts).
      COMMAND_HOST: file-gallery-manager-daemon-test
      COMMAND_PORT: "8094"
      CI: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The mail interceptor's HTTP API. The shared stand mailbox module
      # (framework/frontend/scripts/standMailbox.mjs) reads its address from here
      # and has no default of its own.
      MAILPIT_URL: http://file-gallery-manager-mailpit-test:8025
      # A factor pinned by hand for every Playwright cap. Nothing in the repository
      # sets it, the full run included; the default is deliberately EMPTY rather
      # than "1", because empty means "no override" to the scale and leaves the
      # suite on the host heuristic (HIL-853).
      HILOS_E2E_TIMEOUT_SCALE: ${HILOS_E2E_TIMEOUT_SCALE:-}
    profiles:
      - e2e
    networks:
      - hilos-file-gallery-manager-test-network

volumes:
  nginx-ssl-test:

networks:
  hilos-file-gallery-manager-test-network:
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 - Docker's default
        # address pools. nginx needs a fixed address (the daemon trusts it by that
        # address and nothing else), so this subnet is claimed, not assigned. Inside
        # a default pool that claim loses a race: any other stack whose network came
        # up first may already hold the range, and then the stand fails to start with
        # "Pool overlaps with other one on this address space". 10.0.0.0/8 is never
        # auto-assigned (docs/new-project/README.md).
        - subnet: ${DOCKER_TEST_NETWORK_SUBNET:-10.${HILOS_STAND_NET_FILE_GALLERY_MANAGER:-217}.0.0/16}
