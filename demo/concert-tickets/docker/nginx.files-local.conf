# Angular's dev server proxies /_hilos/file here: the daemon checks access,
# then nginx streams the published file through X-Accel.
# Internal network only. X-Real-IP is omitted because the daemon trusts only
# concert-tickets-nginx-local, whose address is pinned in HILOS_TRUSTED_PROXIES.

server {
    listen 80;

    location = /_hilos/file {
        proxy_pass http://concert-tickets-daemon-local:8090;
        proxy_set_header Host $host;
    }

    location ^~ /__hilos_files/ {
        internal;
        alias /published/;
    }
}
