# The one address of the cluster stand's database: the nodes and the cli know only this, and it
# hands their connections out over the three data members of the Galera cluster, so every member
# is written to.
#
# The addresses come from the environment of the proxy's service (cluster/proxy.yml), read here
# inside double quotes, each a complete host:port.
#
# No log directive: a line per connection is not wanted, and a server changing state is said on
# stderr anyway, which is what `docker logs` shows.

defaults
    mode tcp
    # Just after a member dies, leastconn chooses it for having no connections. Redispatch a
    # refused connection to a live member before the health check marks the first DOWN.
    retries 3
    option redispatch 1
    timeout connect 2s
    # 8h = MariaDB's default wait_timeout (28800 s): a shorter idle timeout would have the proxy
    # cut daemon connections the server keeps. A node reconnects through this address when its
    # member dies (HIL-1231).
    timeout client 8h
    timeout server 8h

# Healthy only while all three members are up behind the proxy: the nodes wait for this before
# they start, since a connection taken with no member behind it reaches them as error 2013. The
# stats page is where the harness reads each server's state.
frontend health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    monitor fail if { nbsrv(galera) lt 3 }
    stats enable
    stats uri /stats

listen galera
    bind :3306
    balance leastconn
    # The agent (framework/docker/galera/agent.sh) says up while Synced or donating: down members
    # take no new connections, while connections already open to a member are left alone.
    default-server check inter 1s rise 2 fall 2 agent-check agent-port 9200 agent-inter 1s
    # Server names are the services' names: the harness matches the states it reads here to the
    # data members by them.
    server concert-tickets-cluster-galera1 "${HILOS_CLUSTER_GALERA_BACKEND_1}"
    server concert-tickets-cluster-galera2 "${HILOS_CLUSTER_GALERA_BACKEND_2}"
    server concert-tickets-cluster-galera3 "${HILOS_CLUSTER_GALERA_BACKEND_3}"
