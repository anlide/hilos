# Docker Compose configuration for LOCAL development.
# The full dev stack runs in Docker: MySQL, Mailpit, the daemon, and
# the Angular CLI dev server (concert-tickets-frontend-local, HMR).
# `composer run daemon-start` brings the whole stack up; the cli services
# (profile cli) run on-demand commands (see the composer scripts).
#
# Port plan: the daemon binds fixed in-container ports (8090 status / 8091
# worker comm / 8092 websocket, same as every demo — the nginx template proxies
# /ws to :8092); only the host-side publishes shift per demo so the stacks run
# side by side. This demo holds the 8270–8289 block
# (docs/new-project/README.md, "Ports").
#
# Every ${...} below is compose *interpolation*, resolved before a container
# exists: it comes from the shell environment or from a `.env` next to this file
# (docker/.env, see docker/.env.example), NEVER from the demo's ../.env — that
# one is wired as `env_file` and only reaches container environments. A host-port
# override written into ../.env is silently ignored, so keep the defaults here
# usable as-is.

name: hilos-concert-tickets-local

services:
  # MySQL: inside the network use concert-tickets-mysql-local:3306. From host
  # use localhost:${MYSQL_HOST_PORT} (default 33083).
  concert-tickets-mysql-local:
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    container_name: concert-tickets-mysql-local
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST in docker/.env to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-33083}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-concert-tickets}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - TZ=UTC
    volumes:
      - ./mysql/init-change-log.sh:/docker-entrypoint-initdb.d/10-change-log.sh:ro
      - ./mysql/provision-change-log.sh:/usr/local/bin/provision-change-log.sh:ro
      - ../data/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-concert-tickets-local-network:
        ipv4_address: ${DOCKER_MYSQL_IP:-10.209.0.10}

  # Mail interceptor for the local stack. Every code this demo sends lands here -
  # a letter directly, an SMS through the stand gateway below - and its web UI is
  # published on the host, so a code is read where a person can see it.
  concert-tickets-mailpit-local:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: concert-tickets-mailpit-local
    environment:
      # A local relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8280}:8025"
    restart: unless-stopped
    networks:
      - hilos-concert-tickets-local-network

  # The stack's gateway for every non-mail channel (HIL-492, HIL-653): the daemon
  # points its SMS transport here, and everything the gateway catches it forwards
  # to concert-tickets-mailpit-local as a letter. That is the whole point - a code
  # sent to a phone is read in the browser beside the mailed ones, instead of being
  # unreachable on a local stack. Not published on the host: it is talked to by the
  # daemon, and read through Mailpit's UI above.
  concert-tickets-stand-gateway-local:
    build:
      context: ../../../framework/docker/stand-gateway
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    container_name: concert-tickets-stand-gateway-local
    # The gateway runs on the framework's own TLS server (HIL-921) and loads the
    # classes it needs from the framework itself, so there is still no composer here.
    volumes:
      - ../../../framework:/hilos/framework:ro
    environment:
      MAILPIT_SMTP_HOST: concert-tickets-mailpit-local
      MAILPIT_SMTP_PORT: 1025
      TZ: UTC
    depends_on:
      - concert-tickets-mailpit-local
    restart: unless-stopped
    networks:
      # One name in every stack, and the name the gateway's certificate is issued
      # for (HIL-921): the daemon checks the name of the peer it reaches, so the
      # service name, which differs from stack to stack, cannot be the address.
      hilos-concert-tickets-local-network:
        aliases:
          - stand-gateway

  # The Hilos daemon. The .env file is optional at the compose level: nothing
  # creates it for you, and a fresh checkout starts without one - the values
  # come from this stack and, for anything it does not name, from .env.example.
  concert-tickets-daemon-local:
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../.env
        required: false
    container_name: concert-tickets-daemon-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
      # An override is an absolute path in the shell or docker/.env, mounted
      # at the same path in the daemon and read-only by both nginx services.
      - ${CONCERT_TICKETS_FILES_PUBLISHED_DIR:-../data/files/published}:${CONCERT_TICKETS_FILES_PUBLISHED_DIR:-/app/data/files/published}
    working_dir: /app
    environment:
      - APP_ENV=local
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - HILOS_FILES_XACCEL_LOCATION=/__hilos_files
      - CONCERT_TICKETS_FILES_PUBLISHED_DIR=${CONCERT_TICKETS_FILES_PUBLISHED_DIR:-/app/data/files/published}
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: the websocket port below is published
      # as well, and a connection that reaches it without passing through nginx
      # arrives from the docker network's gateway - a peer that must never be
      # trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_NGINX_IP:-10.209.0.12}/32
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke) reaches the
      # command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - CLUSTER_NODE_NAME=Main node
      - DB_HOST=${DB_HOST:-concert-tickets-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-concert-tickets}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      # Mail goes to the stack's own interceptor, whose UI is published above. The
      # transport is pinned rather than auto-selected: a stack that loses the
      # catcher should fail loudly, not fall back to writing .eml files nobody opens.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-concert-tickets-mailpit-local}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-notifications@concert-tickets.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Hilos Concert Tickets}
      # SMS goes to the stack's own gateway, which mails it on to the same
      # interceptor (HIL-653). A non-empty SMS endpoint is what picks the generic
      # HTTP provider over the stub, so the message really travels.
      - SMS_ENDPOINT_URL=${SMS_ENDPOINT_URL:-https://stand-gateway:18000/sms/send}
      # The gateway answers over TLS with the stand's own certificate (HIL-921), and the
      # daemon verifies it the way it verifies a provider in production: the trust comes
      # from the environment, not from a switch in the client. OpenSSL reads this file
      # beside the system's certificate directory, so every other peer stays trusted.
      - SSL_CERT_FILE=/hilos/framework/docker/stand-gateway/tls/ca.pem
      # The "it was not me" link of a second-factor removal notice (HIL-494) travels in
      # a letter, so it is absolute. Overridden rather than inherited: the framework
      # default names port 5173, and this stack publishes its dev server on 5184 - so the
      # default would mail a person a link into another application's front end.
      - HILOS_SECOND_FACTOR_CANCEL_URL=${HILOS_SECOND_FACTOR_CANCEL_URL:-http://localhost:5184/auth/second-factor/cancel}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - concert-tickets-mysql-local
      - concert-tickets-mailpit-local
      - concert-tickets-stand-gateway-local
    ports:
      # Host-side publishes: container ports stay fixed, the host side shifts
      # per the demo port plan so several stacks run side by side.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${HTTP_STATUS_HOST_PORT:-8270}:8090"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WORKER_COMM_HOST_PORT:-8271}:8091"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WEBSOCKET_HOST_PORT:-8272}:8092"
    restart: unless-stopped
    networks:
      hilos-concert-tickets-local-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-10.209.0.11}

  concert-tickets-cli-local:
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../.env
        required: false
    container_name: concert-tickets-cli-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=local
      # The daemon's trust in the stand gateway's certificate (HIL-921), so a command
      # that reaches the gateway from here verifies it the same way.
      - SSL_CERT_FILE=/hilos/framework/docker/stand-gateway/tls/ca.pem
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-10.209.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
      - DB_HOST=${DB_HOST:-concert-tickets-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-concert-tickets}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      - concert-tickets-mysql-local
    networks:
      - hilos-concert-tickets-local-network

  # Prod-parity nginx over the BUILT frontend artifact (profile full — only
  # `daemon-start-build` starts it; the dev loop uses the ng dev server instead).
  # Run `composer run frontend:build` first: this mounts frontend/dist read-only,
  # and docker would otherwise create it empty and serve 404s.
  concert-tickets-nginx-local:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: concert-tickets-nginx-local
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../data/data_export:/data_export:ro
      - ${CONCERT_TICKETS_FILES_PUBLISHED_DIR:-../data/files/published}:/published:ro
      - nginx-ssl-local:/etc/nginx/ssl
    ports:
      # HTTPS only. The container's own :80 vhost stays unpublished on purpose —
      # it 301s to https://$host with the port dropped, which lands on whatever
      # holds 443 (another demo's stack), not here. Reach this stack over HTTPS.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_HTTPS_PORT:-8276}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=concert-tickets-daemon-local
    depends_on:
      - concert-tickets-daemon-local
    restart: unless-stopped
    profiles:
      - full
    networks:
      hilos-concert-tickets-local-network:
        ipv4_address: ${DOCKER_NGINX_IP:-10.209.0.12}

  # Angular's dev server uses this internal gateway to stream registry files.
  # The full/preview frontend uses concert-tickets-nginx-local with the same directory.
  concert-tickets-files-local:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: concert-tickets-files-local
    volumes:
      - ./nginx.files-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CONCERT_TICKETS_FILES_PUBLISHED_DIR:-../data/files/published}:/published:ro
    depends_on:
      - concert-tickets-daemon-local
    restart: unless-stopped
    networks:
      - hilos-concert-tickets-local-network

  # Angular CLI dev server (`ng serve`, Vite-based under the hood) with HMR for
  # the frontend. Mounts the whole repo at /hilos so the @hilos/angular `file:`
  # symlink into framework/frontend resolves, and runs npm install first so a
  # fresh checkout or an SDK re-vendor is picked up. The host port is this demo's
  # own, so every local stack can run side by side. Angular has no
  # import.meta.env mechanism, so the dev server proxies the app's same-origin
  # /ws to the daemon (frontend/proxy.conf.json).
  concert-tickets-frontend-local:
    image: node:26.13.0-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
    container_name: concert-tickets-frontend-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/concert-tickets/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # Browser storage belongs to DOM tests and the browser, not Node SSR.
      NODE_OPTIONS: "--no-experimental-webstorage"
    command: sh -c "npm install && npm run dev"
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${FRONTEND_DEV_PORT:-5184}:5173"
    restart: unless-stopped
    networks:
      - hilos-concert-tickets-local-network

  # On-demand Node toolchain for the frontend (npm install / build / check).
  # Profile cli so it never starts with the stack — invoked per command via
  # `run --rm` (see the composer frontend:* scripts).
  concert-tickets-frontend-cli-local:
    image: node:26.13.0-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
    container_name: concert-tickets-frontend-cli-local
    volumes:
      - ../../..:/hilos
      # A private Angular disk cache, mounted over the repo copy. `.angular/cache`
      # is an lmdb database owned by the long-lived dev server
      # (concert-tickets-frontend-local); lmdb opened from two containers at once
      # corrupts its reader lock table (PID namespaces overlap) and crashes ng
      # build. Keeping the two apart lets this container keep the cache ENABLED.
      - ng-cache-cli-local:/hilos/demo/concert-tickets/frontend/.angular
    working_dir: /hilos/demo/concert-tickets/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # Browser storage belongs to DOM tests and the browser, not Node SSR.
      NODE_OPTIONS: "--no-experimental-webstorage"
    profiles:
      - cli
    networks:
      - hilos-concert-tickets-local-network

volumes:
  nginx-ssl-local:
  ng-cache-cli-local:

networks:
  hilos-concert-tickets-local-network:
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 - Docker's default
        # address pools. nginx needs a fixed address (the daemon trusts it by that
        # address and nothing else), so this subnet is claimed, not assigned. Inside
        # a default pool that claim loses a race: any other stack whose network came
        # up first may already hold the range, and then the stand fails to start with
        # "Pool overlaps with other one on this address space". 10.0.0.0/8 is never
        # auto-assigned; the column of this demo is 10.2x9
        # (docs/new-project/README.md).
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.209.0.0/16}
