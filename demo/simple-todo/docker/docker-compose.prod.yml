# Docker Compose configuration for PRODUCTION (Linux)
# Both frontend (nginx) and backend run in Docker. The database is external
# (managed), configured through ../.env — no mysql service here, unlike the
# local/test stacks.

name: hilos-simple-todo-prod

services:
  todo-prod:
    build: .
    env_file:
      - ../.env
    container_name: todo-daemon-prod
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=${HTTP_STATUS_HOST:-0.0.0.0}
      - HTTP_STATUS_PORT=${HTTP_STATUS_PORT:-8090}
      - WORKER_COMM_HOST=${WORKER_COMM_HOST:-0.0.0.0}
      - WORKER_COMM_PORT=${WORKER_COMM_PORT:-8091}
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-2}
      - WEBSOCKET_HOST=${WEBSOCKET_HOST:-0.0.0.0}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-8092}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    ports:
      # Expose WebSocket port to host for frontend access
      - "${WEBSOCKET_PORT:-8092}:${WEBSOCKET_PORT:-8092}"
    expose:
      - "${HTTP_STATUS_PORT:-8090}"
      - "${WORKER_COMM_PORT:-8091}"
    restart: unless-stopped
    networks:
      hilos-simple-todo-prod-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-172.27.0.11}

  # Builds the production frontend artifact into ../frontend/dist, which
  # todo-frontend-prod serves. Mounts the whole repo at /hilos so the
  # @hilos/react `file:` dependency into framework/frontend resolves and
  # `npm run build`'s prebuild can build the SDK first
  # (docs/agents/frontend/build-and-docker.md) — the same layout as the test
  # builder. Run on demand via the `build` profile, before bringing up
  # todo-frontend-prod.
  todo-frontend-builder:
    image: node:22-bookworm-slim
    container_name: todo-frontend-builder-prod
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/simple-todo/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: sh -c "npm install && npm run build"
    profiles:
      - build

  # Nginx for serving frontend production build (HTTPS-only). The Vite build
  # emits a flat dist — index.html (SPA shell) plus one <route>.html per
  # prerendered public page (docs/agents/frontend/build-and-docker.md).
  todo-frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: todo-frontend-prod
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-prod:/etc/nginx/ssl
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=todo-prod
    depends_on:
      - todo-prod
    restart: unless-stopped
    networks:
      - hilos-simple-todo-prod-network

  todo-cli-prod:
    build: .
    env_file:
      - ../.env
    container_name: todo-cli-prod
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - TERM=xterm-256color
      - HILOS_DAEMON_HOST=${HILOS_DAEMON_HOST:-172.27.0.11}
      - HTTP_STATUS_PORT=${HTTP_STATUS_PORT:-8090}
      - WORKER_COMM_PORT=${WORKER_COMM_PORT:-8091}
    profiles:
      - composer
    networks:
      - hilos-simple-todo-prod-network

  todo-monitor-prod:
    build: .
    env_file:
      - ../.env
    container_name: todo-monitor-prod
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - HILOS_DAEMON_HOST=${HILOS_DAEMON_HOST:-172.27.0.11}
      - HTTP_STATUS_PORT=${HTTP_STATUS_PORT:-8090}
      - WORKER_COMM_PORT=${WORKER_COMM_PORT:-8091}
    profiles:
      - monitor
    networks:
      - hilos-simple-todo-prod-network

volumes:
  nginx-ssl-prod:

networks:
  hilos-simple-todo-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.27.0.0/16}
