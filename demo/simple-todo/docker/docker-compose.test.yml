# Docker Compose configuration for tests (Playwright e2e).
# Isolated from the local stack (different ports, network).
#
# e2e runs against the BUILT frontend artifact served by todo-nginx-test
# (docs/agents/frontend/testing-strategy.md). The demo has no backend yet, so
# the stack is nginx-only; MySQL and a booted daemon join it when the backend
# lands at rewrite step 7. The stack starts via `composer run test:e2e-up`,
# then any number of `composer run test:e2e` invocations drive it, then
# `test:e2e-down`. Services sit behind profiles so nothing starts implicitly.

name: hilos-simple-todo-test

services:
  # On-demand Node toolchain for the simple-todo frontend (npm install / build /
  # check). Mounts the whole repo at /hilos so the @hilos/react `file:`
  # dependency into framework/frontend resolves. Used by
  # `composer run test:e2e-build` to produce the dist that todo-nginx-test
  # serves.
  todo-frontend-cli-test:
    image: node:22-bookworm-slim
    container_name: todo-frontend-cli-test
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/simple-todo/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - cli

  # Serves the built frontend artifact. Static-only for now: the demo ships no
  # backend yet, so there is nothing to proxy; the prod-parity nginx (template,
  # TLS, /ws proxy) arrives with the backend at rewrite step 7. The e2e runner
  # reaches it in-network as http://todo-nginx-test; the host port is only for
  # manual inspection and defaults away from the chat test stack's 8086.
  todo-nginx-test:
    image: nginx:alpine
    container_name: todo-nginx-test
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_TEST_HTTP_PORT:-8087}:80"
    profiles:
      - e2e
    networks:
      - hilos-simple-todo-test-network

  # Playwright e2e runner. The official image ships the browsers — its version
  # tag MUST match `@playwright/test` in tests/e2e/package.json, otherwise
  # Playwright cannot locate its browser executables. BASE_URL points at the
  # in-network nginx, so the run never depends on host ports. No depends_on:
  # the stack is started explicitly via `composer run test:e2e-up`, never as a
  # side effect of running tests. node_modules installs onto the host
  # bind-mount (docs/agents/frontend/build-and-docker.md).
  todo-e2e-runner:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    container_name: todo-e2e-runner
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/simple-todo/tests/e2e
    environment:
      BASE_URL: http://todo-nginx-test
      CI: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - e2e
    networks:
      - hilos-simple-todo-test-network

networks:
  hilos-simple-todo-test-network:
    driver: bridge
