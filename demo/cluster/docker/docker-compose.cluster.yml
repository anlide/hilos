# Multi-node daemon-cluster e2e stack (HIL-185).
#
# One shared MariaDB (per-node schemas), five daemon nodes on a dedicated bridge
# with static IPs — three masters (the consensus/master-set) and two data-plane
# slaves (the placement targets) — and a long-lived CLI container the harness
# `docker exec`s to run `test:cluster:inspect` against each node. Node role,
# identity, capabilities, master set, and timeouts all come from CLUSTER_* env, so
# the same image is a master or a data-plane node purely by configuration.

name: hilos-cluster

x-node-base: &node-base
  build: .
  restart: "no"
  command: ["php", "backend/Bootstrap/docker.php"]
  depends_on:
    cluster-mysql:
      condition: service_healthy

x-node-env: &node-env
  # APP_ENV is required of every node (HIL-566), and the value is `dev`, not `test`:
  # `dev` is not production-like, so the nodes admit the test-only commands this
  # harness drives. It used to be forced as well - on `test` the daemon loads
  # tests/.env, whose DB_DATABASE would have overridden every node's per-schema value
  # - but that reason is gone since the compose environment outranks any env file, and
  # moving the nodes to `test` is a separate question for this harness. Only the
  # cluster-cli container runs as APP_ENV=test, and it has no per-schema database to
  # lose.
  APP_ENV: dev
  DB_HOST: cluster-mysql
  DB_PORT: "3306"
  DB_USERNAME: hilos
  DB_PASSWORD: hilos_pass
  HTTP_STATUS_HOST: 0.0.0.0
  HTTP_STATUS_PORT: "8090"
  WORKER_COMM_HOST: 0.0.0.0
  WORKER_COMM_PORT: "8091"
  COMMAND_HOST: 0.0.0.0
  COMMAND_PORT: "8094"
  # Every node addresses itself, so an operator command run with `docker exec` in
  # any node's container (admin:create / admin:grant / admin:revoke /
  # protected-mode:open, and the harness's test:cluster:inspect) reaches that
  # node's command channel over loopback.
  HILOS_DAEMON_HOST: 127.0.0.1
  CLUSTER_ENABLED: "true"
  CLUSTER_PEER_HOST: 0.0.0.0
  CLUSTER_PEER_PORT: "8095"
  CLUSTER_MASTER_SET: "m1,m2,m3"
  # CLUSTER_SEEDS is set PER NODE below, each excluding the node's own advertise
  # address: a node must never dial itself (the self-link collapse tears the daemon
  # down). Gossip admits every other peer from any one live seed.
  CLUSTER_ELECTION_TIMEOUT_MIN_MS: "1500"
  CLUSTER_ELECTION_TIMEOUT_MAX_MS: "3000"
  CLUSTER_HEARTBEAT_INTERVAL_MS: "500"
  CLUSTER_LINK_KEEPALIVE_INTERVAL_MS: "1000"
  CLUSTER_LINK_TIMEOUT_MS: "6000"
  CLUSTER_FAILOVER_GRACE_MS: "6000"
  CLUSTER_SLAVE_WORK_GRACE_MS: "4000"
  WORKER_MIN_REGULAR: "1"
  WORKER_MAX_REGULAR: "1"
  WORKER_MIN_MONOPOLISTIC: "1"

services:
  cluster-mysql:
    image: mariadb:11.4
    container_name: cluster-mysql
    environment:
      MYSQL_ROOT_PASSWORD: hilos_root_pass
      MYSQL_DATABASE: hilos-demo-cluster-cli
      MYSQL_USER: hilos
      MYSQL_PASSWORD: hilos_pass
      TZ: UTC
    volumes:
      - mysql-cluster-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      cluster-net:
        ipv4_address: 10.185.0.10

  cluster-m1:
    <<: *node-base
    container_name: cluster-m1
    environment:
      <<: *node-env
      DB_DATABASE: hilos-demo-cluster-m1
      CLUSTER_NODE_ID: m1
      CLUSTER_NODE_ROLE: master
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.185.0.11:8095"
      CLUSTER_SEEDS: "10.185.0.12:8095,10.185.0.13:8095,10.185.0.14:8095,10.185.0.15:8095"
      WORKER_MIN_MONOPOLISTIC: "0"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs/m1:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.185.0.11

  cluster-m2:
    <<: *node-base
    container_name: cluster-m2
    environment:
      <<: *node-env
      DB_DATABASE: hilos-demo-cluster-m2
      CLUSTER_NODE_ID: m2
      CLUSTER_NODE_ROLE: master
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.185.0.12:8095"
      CLUSTER_SEEDS: "10.185.0.11:8095,10.185.0.13:8095,10.185.0.14:8095,10.185.0.15:8095"
      WORKER_MIN_MONOPOLISTIC: "0"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs/m2:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.185.0.12

  cluster-m3:
    <<: *node-base
    container_name: cluster-m3
    environment:
      <<: *node-env
      DB_DATABASE: hilos-demo-cluster-m3
      CLUSTER_NODE_ID: m3
      CLUSTER_NODE_ROLE: master
      CLUSTER_NODE_CAPABILITIES: ""
      CLUSTER_PEER_ADVERTISE: "10.185.0.13:8095"
      CLUSTER_SEEDS: "10.185.0.11:8095,10.185.0.12:8095,10.185.0.14:8095,10.185.0.15:8095"
      WORKER_MIN_MONOPOLISTIC: "0"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs/m3:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.185.0.13

  cluster-s1:
    <<: *node-base
    container_name: cluster-s1
    environment:
      <<: *node-env
      DB_DATABASE: hilos-demo-cluster-s1
      CLUSTER_NODE_ID: s1
      CLUSTER_NODE_ROLE: slave
      CLUSTER_NODE_CAPABILITIES: "worker"
      CLUSTER_PEER_ADVERTISE: "10.185.0.14:8095"
      CLUSTER_SEEDS: "10.185.0.11:8095,10.185.0.12:8095,10.185.0.13:8095,10.185.0.15:8095"
      # Fleet members share these regular workers. A member's synthetic job blocks its
      # worker, so several of them keep the whole fleet ticking even when one node holds
      # it all after a failover.
      WORKER_MIN_REGULAR: "5"
      WORKER_MAX_REGULAR: "5"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs/s1:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.185.0.14

  cluster-s2:
    <<: *node-base
    container_name: cluster-s2
    environment:
      <<: *node-env
      DB_DATABASE: hilos-demo-cluster-s2
      CLUSTER_NODE_ID: s2
      CLUSTER_NODE_ROLE: slave
      CLUSTER_NODE_CAPABILITIES: "worker"
      CLUSTER_PEER_ADVERTISE: "10.185.0.15:8095"
      CLUSTER_SEEDS: "10.185.0.11:8095,10.185.0.12:8095,10.185.0.13:8095,10.185.0.14:8095"
      # Regular workers the fleet members share on this node; see s1.
      WORKER_MIN_REGULAR: "5"
      WORKER_MAX_REGULAR: "5"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs/s2:/var/log/hilos
    networks:
      cluster-net:
        ipv4_address: 10.185.0.15

  # Long-lived CLI container the harness `docker exec`s for test:cluster:inspect,
  # and the one-shot runner for composer/phpunit (profile cli, so it never joins a
  # cluster bring-up implicitly). Deliberately WITHOUT HILOS_DAEMON_HOST: unlike a
  # demo's cli service, which faces one daemon, this one addresses five nodes in
  # turn, so the caller names the node (`docker exec -e HILOS_DAEMON_HOST=<ip>`,
  # see the cluster script).
  cluster-cli:
    build: .
    container_name: cluster-cli
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      APP_ENV: test
      DB_HOST: cluster-mysql
      DB_PORT: "3306"
      DB_DATABASE: hilos-demo-cluster-cli
      DB_USERNAME: hilos
      DB_PASSWORD: hilos_pass
      COMMAND_PORT: "8094"
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    depends_on:
      cluster-mysql:
        condition: service_healthy
    profiles:
      - cli
    networks:
      - cluster-net

volumes:
  mysql-cluster-data:
    name: hilos-cluster-mysql-data

networks:
  cluster-net:
    name: hilos-cluster-net
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 — Docker's default
        # address pools. The nodes need fixed addresses (peers advertise them, and
        # `cluster heal` reconnects a partitioned node on its original IP), so this
        # subnet is claimed, not assigned. Inside a default pool that claim loses a
        # race: any other stack whose network came up first may already hold the
        # range, and then the whole cluster fails to start with "Pool overlaps with
        # other one on this address space". 10.0.0.0/8 is never auto-assigned.
        - subnet: 10.185.0.0/16
