# Docker Compose configuration for LOCAL development (Windows)
# Backend runs in Docker, frontend can run locally or in Docker (via websocket-test-frontend-local service)

name: hilos-websocket-test-local

services:
  mysql-local:
    image: mariadb:11.4
    container_name: hilos-mysql-local
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-websocket}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - TZ=UTC
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ../data/backup:/root/backup
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-demo-websocket-test-local-network:
        ipv4_address: ${DOCKER_MYSQL_IP:-172.26.0.10}

  phpmyadmin-local:
    image: phpmyadmin:latest
    container_name: hilos-phpmyadmin-local
    environment:
      - PMA_HOST=mysql-local
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=256M
    depends_on:
      - mysql-local
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - hilos-demo-websocket-test-local-network

  websocket-test-local:
    build: .
    env_file:
      - ../.env
    container_name: websocket-test-daemon-local
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=${HTTP_STATUS_HOST:-0.0.0.0}
      - HTTP_STATUS_PORT=${HTTP_STATUS_PORT:-8090}
      - WORKER_COMM_HOST=${WORKER_COMM_HOST:-0.0.0.0}
      - WORKER_COMM_PORT=${WORKER_COMM_PORT:-8091}
      - WEBSOCKET_HOST=${WEBSOCKET_HOST:-0.0.0.0}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-8092}
      - DB_HOST=${DB_HOST:-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-websocket}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - mysql-local
    ports:
      # Expose ports to host for local frontend access
      - "${HTTP_STATUS_PORT:-8090}:${HTTP_STATUS_PORT:-8090}"
      - "${WORKER_COMM_PORT:-8091}:${WORKER_COMM_PORT:-8091}"
      - "${WEBSOCKET_PORT:-8092}:${WEBSOCKET_PORT:-8092}"
    restart: unless-stopped
    networks:
      hilos-demo-websocket-test-local-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-172.26.0.11}

  websocket-test-cli-local:
    build: .
    env_file:
      - ../.env
    container_name: websocket-test-cli-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${HILOS_DAEMON_HOST:-172.26.0.11}
      - HTTP_STATUS_PORT=${HTTP_STATUS_PORT:-8090}
      - WORKER_COMM_PORT=${WORKER_COMM_PORT:-8091}
      - DB_HOST=${DB_HOST:-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-websocket}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - composer
    depends_on:
      - mysql-local
    networks:
      - hilos-demo-websocket-test-local-network

  websocket-test-monitor-local:
    build: .
    env_file:
      - ../.env
    container_name: websocket-test-monitor-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - HILOS_DAEMON_HOST=${HILOS_DAEMON_HOST:-172.26.0.11}
      - HTTP_STATUS_PORT=${HTTP_STATUS_PORT:-8090}
      - WORKER_COMM_PORT=${WORKER_COMM_PORT:-8091}
    profiles:
      - monitor
    networks:
      - hilos-demo-websocket-test-local-network

  websocket-test-frontend-local:
    image: node:20-alpine
    container_name: websocket-test-frontend-local
    volumes:
      - ../frontend:/app
      # Mount framework for SDK access
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DOCKER=true
    command: npm run dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    restart: unless-stopped
    networks:
      - hilos-demo-websocket-test-local-network

networks:
  hilos-demo-websocket-test-local-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.26.0.0/16}
