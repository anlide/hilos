<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">Hilos Chat — speech bubble</title>
  <desc id="desc">A violet speech bubble with three dots. In the bottom-right corner, a plain blue dot.</desc>
  <!-- HIL-2151: the small sign of the chat demo.
       Redrawn in HIL-2261 with the mark in the bottom-right corner.
       Symbol: original geometry for HIL-2261, a wide speech bubble with three dots.
       Corner mark: the Hilos logo, original geometry. MIT; see ../README.md. -->
  <mask id="hilos-mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="25" cy="25" r="9" fill="#000"/>
  </mask>
  <g id="demo-symbol" fill="#845EF7" mask="url(#hilos-mark-gap)">
    <path fill-rule="evenodd" d="M4 0H24A4 4 0 0 1 28 4V12A4 4 0 0 1 24 16H12L4 24V16A4 4 0 0 1 0 12V4A4 4 0 0 1 4 0ZM4 8a2 2 0 1 0 4 0a2 2 0 1 0 -4 0ZM12 8a2 2 0 1 0 4 0a2 2 0 1 0 -4 0ZM20 8a2 2 0 1 0 4 0a2 2 0 1 0 -4 0Z"/>
  </g>
  <g id="hilos-mark">
    <circle cx="25" cy="25" r="7" fill="#0288D1"/>
  </g>
</svg>
