# Docker Compose configuration for PRODUCTION (Linux)
# The whole installation runs in Docker: its own database, the daemon, and the
# nginx that serves the built frontend.
#
# Every ${...} below is compose interpolation, read from the shell or from
# docker/.env (see docker/.env.example), never from ../.env. Six of them belong to
# the installation and have no default: MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
# DOCKER_NETWORK_SUBNET, DOCKER_MYSQL_IP, DOCKER_DAEMON_IP and DOCKER_NGINX_IP.
# Without them the stack refuses to start rather than run production on a password
# published in this repository or on an address another stack of this host holds.
# No service names its container: `docker compose -p <environment>` names them all,
# so two environments of one demo can stand on one host.
#
# HILOS_DATA_ROOT is where the installation keeps everything that must outlive
# its code: the database, uploads, exports, Status files and logs. It defaults to
# ../data inside this checkout. An installation that replaces its code by
# unpacking a new release beside the old one sets it to an absolute path outside
# both, and every service below mounts its data from there.

name: hilos-chat-prod

services:
  # The installation's database. Not published on the host: only the services of
  # this network talk to it. The database and user names default to the ones
  # mysql/init.sql grants.
  mysql-prod:
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-chat}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
      - TZ=UTC
    volumes:
      - ${HILOS_DATA_ROOT:-../data}/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql/init-change-log.sh:/docker-entrypoint-initdb.d/init-change-log.sh:ro
      - ./mysql/provision-change-log.sh:/usr/local/bin/provision-change-log.sh:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-demo-chat-prod-network:
        ipv4_address: ${DOCKER_MYSQL_IP:?set DOCKER_MYSQL_IP in docker/.env}

  chat-prod:
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      # The installation's data over the checkout's own data directory.
      - ${HILOS_DATA_ROOT:-../data}:/app/data
      - ${HILOS_DATA_ROOT:-../data}/logs-prod:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=prod
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - HILOS_DATA_EXPORT_XACCEL_LOCATION=/__hilos_data_export
      - HILOS_LEGAL_EXPORT_XACCEL_LOCATION=/__hilos_legal_export
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: every other peer on this network,
      # the CLI and monitor containers and the docker gateway among them, must
      # never be trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_NGINX_IP:?set DOCKER_NGINX_IP in docker/.env}/32
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke / protected-mode:open speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - CLUSTER_NODE_NAME=Main node
      # The admin view mode of the demo: a non-admin may open the admin section to
      # look and change nothing (HIL-1249). On production this line is required by
      # DemoStackComposeGuardTest - a production node started without it closes the
      # mode on the installation for good.
      - HILOS_ADMIN_VIEW_MODE_ENABLED=true
      - FRONTEND_HTML_HOST=0.0.0.0
      - FRONTEND_HTML_PORT=8093
      - FRONTEND_DIST_PATH=${FRONTEND_DIST_PATH:-/app/frontend/dist}
      - HILOS_FILES_XACCEL_LOCATION=${HILOS_FILES_XACCEL_LOCATION:-/__hilos_files}
      - DB_HOST=${DB_HOST:-mysql-prod}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-chat}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - mysql-prod
    # Nothing is published: the browser reaches the websocket through nginx (/ws).
    expose:
      - "8090"
      - "8091"
      - "8093"
    restart: unless-stopped
    networks:
      hilos-demo-chat-prod-network:
        ipv4_address: ${DOCKER_DAEMON_IP:?set DOCKER_DAEMON_IP in docker/.env}

  # Builds the production frontend artifact into ../frontend/dist, which
  # chat-frontend-prod serves. Mounts the whole repo at /hilos so the @hilos/vue
  # `file:` dependency into framework/frontend resolves and `npm run build`'s
  # prebuild can build the SDK first (docs/agents/frontend/build-and-docker.md) —
  # the same layout as the test builder. Run on demand via the `build` profile,
  # before bringing up chat-frontend-prod.
  chat-frontend-builder:
    image: node:26.13.0-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/chat/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NODE_OPTIONS: "--no-experimental-webstorage"
    command: sh -c "npm install && npm run build"
    profiles:
      - build

  # Nginx for serving frontend production build (HTTPS-only)
  chat-frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ${HILOS_DATA_ROOT:-../data}/data_export:/data_export:ro
      - ${HILOS_DATA_ROOT:-../data}/status:/status:ro
      - ${HILOS_DATA_ROOT:-../data}/legal_export:/legal_export:ro
      - nginx-ssl-prod:/etc/nginx/ssl
      # Published attachments, streamed by nginx via the daemon's X-Accel-Redirect.
      - ${HILOS_DATA_ROOT:-../data}/chat_attachments/published:/published:ro
    ports:
      # The public front door on every address by default. An installation behind
      # a proxy of its own on the same host sets HILOS_BIND_HOST=127.0.0.1 and
      # moves the ports aside in docker/.env.
      - "${HILOS_BIND_HOST:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
      - "${HILOS_BIND_HOST:-0.0.0.0}:${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=chat-prod
      # The proxy in front of this nginx whose X-Real-IP names the visitor,
      # comma-separated CIDRs. Empty trusts nobody, which is right for a front
      # door; behind a proxy it would make every visitor the proxy's one address.
      - NGINX_REAL_IP_FROM=${NGINX_REAL_IP_FROM:-}
    depends_on:
      - chat-prod
    restart: unless-stopped
    networks:
      hilos-demo-chat-prod-network:
        ipv4_address: ${DOCKER_NGINX_IP:?set DOCKER_NGINX_IP in docker/.env}

  chat-cli-prod:
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ${HILOS_DATA_ROOT:-../data}:/app/data
    working_dir: /app
    environment:
      - APP_ENV=prod
      - TERM=xterm-256color
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:?set DOCKER_DAEMON_IP in docker/.env}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
      - DB_HOST=${DB_HOST:-mysql-prod}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-chat}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
    profiles:
      - composer
    networks:
      - hilos-demo-chat-prod-network

  chat-monitor-prod:
    build:
      context: .
      additional_contexts:
        hilos-event: ../../../framework/docker/native/event
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=prod
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:?set DOCKER_DAEMON_IP in docker/.env}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - monitor
    networks:
      - hilos-demo-chat-prod-network

volumes:
  nginx-ssl-prod:

networks:
  hilos-demo-chat-prod-network:
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 - Docker's default
        # address pools. nginx needs a fixed address (the daemon trusts it by that
        # address and nothing else), so this subnet is claimed, not assigned. Inside
        # a default pool that claim loses a race: any other stack whose network came
        # up first may already hold the range, and then the stand fails to start with
        # "Pool overlaps with other one on this address space". 10.0.0.0/8 is never
        # auto-assigned (docs/new-project/README.md).
        - subnet: ${DOCKER_NETWORK_SUBNET:?set DOCKER_NETWORK_SUBNET in docker/.env}
