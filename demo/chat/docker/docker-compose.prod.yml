# Docker Compose configuration for PRODUCTION (Linux)
# Both frontend (nginx) and backend run in Docker

name: hilos-chat-prod

services:
  chat-prod:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-daemon-prod
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=prod
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-14}
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: the websocket port below is published
      # as well, and a connection that reaches it without passing through nginx
      # arrives from the docker network's gateway - a peer that must never be
      # trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_NGINX_IP:-172.26.0.12}/32
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke / protected-mode:open speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - FRONTEND_HTML_HOST=0.0.0.0
      - FRONTEND_HTML_PORT=8093
      - FRONTEND_DIST_PATH=${FRONTEND_DIST_PATH:-/app/frontend/dist}
      - CHAT_FILES_XACCEL_LOCATION=${CHAT_FILES_XACCEL_LOCATION:-/__chat_published}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    ports:
      # Expose WebSocket port to host for frontend access
      - "${WEBSOCKET_PORT:-8092}:8092"
    expose:
      - "8090"
      - "8091"
      - "8093"
    restart: unless-stopped
    networks:
      hilos-demo-chat-prod-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-172.26.0.11}

  # Builds the production frontend artifact into ../frontend/dist, which
  # chat-frontend-prod serves. Mounts the whole repo at /hilos so the @hilos/vue
  # `file:` dependency into framework/frontend resolves and `npm run build`'s
  # prebuild can build the SDK first (docs/agents/frontend/build-and-docker.md) —
  # the same layout as the test builder. Run on demand via the `build` profile,
  # before bringing up chat-frontend-prod.
  chat-frontend-builder:
    image: node:22-bookworm-slim
    container_name: chat-frontend-builder-prod
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/chat/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: sh -c "npm install && npm run build"
    profiles:
      - build

  # Nginx for serving frontend production build (HTTPS-only)
  chat-frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: chat-frontend-prod
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-prod:/etc/nginx/ssl
      # Published attachments, streamed by nginx via the daemon's X-Accel-Redirect.
      - ../data/chat_attachments/published:/published:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=chat-prod
    depends_on:
      - chat-prod
    restart: unless-stopped
    networks:
      hilos-demo-chat-prod-network:
        ipv4_address: ${DOCKER_NGINX_IP:-172.26.0.12}

  chat-cli-prod:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-cli-prod
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=prod
      - TERM=xterm-256color
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.26.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - composer
    networks:
      - hilos-demo-chat-prod-network

  chat-monitor-prod:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-monitor-prod
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=prod
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.26.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - monitor
    networks:
      - hilos-demo-chat-prod-network

volumes:
  nginx-ssl-prod:

networks:
  hilos-demo-chat-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.26.0.0/16}
