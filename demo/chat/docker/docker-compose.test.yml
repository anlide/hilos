# Docker Compose configuration for tests (unit, integration, Playwright)
# Isolated from dev stack (different ports, volumes, network)

name: hilos-chat-test

services:
  mysql-test:
    image: mariadb:11.4
    container_name: hilos-mysql-test
    ports:
      - "${MYSQL_TEST_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      MYSQL_USER: ${MYSQL_USER:-hilos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hilos_pass}
      TZ: UTC
    volumes:
      - mysql-test-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - hilos-chat-test-network

  chat-test:
    build: .
    env_file:
      - ../tests/.env
    container_name: chat-daemon-test
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-test:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=test
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-10}
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      - FRONTEND_HTML_HOST=0.0.0.0
      - FRONTEND_HTML_PORT=8093
      - FRONTEND_DIST_PATH=/app/frontend/dist
    command: ["php", "backend/Bootstrap/docker.php"]
    depends_on:
      mysql-test:
        condition: service_healthy
    ports:
      - "${HTTP_TEST_PORT:-8095}:8090"
      - "${WORKER_TEST_PORT:-8096}:8091"
      - "${WEBSOCKET_TEST_PORT:-8097}:8092"
    networks:
      - hilos-chat-test-network

  chat-frontend-builder:
    image: node:20-alpine
    container_name: chat-frontend-builder-test
    volumes:
      - ../../..:/workspace
    working_dir: /workspace/demo/chat/frontend
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - VITE_WEBSOCKET_HOST=chat-nginx-test
      - VITE_WEBSOCKET_PORT=443
      - VITE_WEBSOCKET_PROTOCOL=wss
      - VITE_WEBSOCKET_PATH=/ws
    command: sh -c "npm ci --include=dev && npm run build:docker"
    profiles:
      - build

  chat-nginx-test:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: chat-nginx-test
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-test:/etc/nginx/ssl
    ports:
      - "${NGINX_TEST_HTTP_PORT:-80}:80"
      - "${NGINX_TEST_HTTPS_PORT:-443}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=chat-test
    depends_on:
      - chat-test
    networks:
      - hilos-chat-test-network

  chat-cli-test:
    build: .
    env_file:
      - ../tests/.env
    container_name: chat-cli-test
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - APP_ENV=test
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - hilos-chat-test-network

  # Vitest runner for demo/chat/frontend.
  # Self-contained node-22 container; no DB, no app-stack network.
  # Repo mounted as /workspace so that `@hilos/sdk` alias can reach the
  # framework sources at /workspace/framework/frontend/src.
  # node_modules live in an anonymous volume to keep the Windows FS clean.
  chat-frontend-test:
    image: node:22-alpine
    container_name: chat-frontend-test
    volumes:
      - ../../..:/workspace
      - /workspace/demo/chat/tests/frontend/node_modules
    working_dir: /workspace/demo/chat/tests/frontend
    environment:
      CI: "1"
    profiles:
      - cli

  # Playwright E2E runner (dockerized).
  # Uses the official Playwright image with browsers baked in — version tag
  # MUST match `@playwright/test` in tests/e2e/package.json, otherwise
  # Playwright cannot locate its browser executables.
  # BASE_URL points to the in-network nginx service, so we never depend on
  # host ports 80/443 for the E2E run itself.
  chat-e2e-runner:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    container_name: chat-e2e-runner
    volumes:
      - ../../..:/workspace
      - /workspace/demo/chat/tests/e2e/node_modules
    working_dir: /workspace/demo/chat/tests/e2e
    environment:
      BASE_URL: https://chat-nginx-test
      CI: "1"
    depends_on:
      - chat-nginx-test
    profiles:
      - e2e
    networks:
      - hilos-chat-test-network

volumes:
  mysql-test-data:
    name: hilos-chat-mysql-test-data
  nginx-ssl-test:

networks:
  hilos-chat-test-network:
    driver: bridge
