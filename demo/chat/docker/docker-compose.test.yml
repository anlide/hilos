# Docker Compose configuration for tests (unit, integration, Playwright e2e)
# Isolated from dev stack (different ports, volumes, network).
#
# e2e runs against the BUILT frontend artifact served by chat-nginx-test with a
# booted daemon behind it (docs/agents/frontend/testing-strategy.md). The e2e
# stack (mysql + daemon + nginx) starts via `composer run test:e2e-up`, then any
# number of `composer run test:e2e` invocations drive it, then `test:e2e-down`.
# Frontend services sit behind profiles so the PHP-only test commands never
# start them.

name: hilos-chat-test

services:
  mysql-test:
    image: mariadb:11.4
    container_name: chat-mysql-test
    ports:
      - "${MYSQL_TEST_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      MYSQL_USER: ${MYSQL_USER:-hilos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hilos_pass}
      TZ: UTC
    volumes:
      - mysql-test-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - hilos-chat-test-network

  chat-test:
    build: .
    env_file:
      - ../tests/.env
    container_name: chat-daemon-test
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-test:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=test
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-10}
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      - FRONTEND_HTML_HOST=0.0.0.0
      - FRONTEND_HTML_PORT=8093
      - FRONTEND_DIST_PATH=/app/frontend/dist
      - CHAT_FILES_XACCEL_LOCATION=/__chat_published
    command: ["php", "backend/Bootstrap/docker.php"]
    depends_on:
      mysql-test:
        condition: service_healthy
    ports:
      - "${HTTP_TEST_PORT:-8095}:8090"
      - "${WORKER_TEST_PORT:-8096}:8091"
      - "${WEBSOCKET_TEST_PORT:-8097}:8092"
    networks:
      - hilos-chat-test-network

  # On-demand Node toolchain for the chat frontend (npm install / build / check).
  # Mounts the whole repo at /hilos so the @hilos/vue `file:` dependency into
  # framework/frontend resolves. Used by `composer run test:e2e-build` to produce
  # the dist that chat-nginx-test serves.
  chat-frontend-cli-test:
    image: node:22-bookworm-slim
    container_name: chat-frontend-cli-test
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/chat/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - cli

  # Serves the built frontend artifact over the same nginx image and config
  # template as prod (test what you ship) and proxies /ws to the daemon. The
  # e2e runner reaches it in-network as https://chat-nginx-test; host ports are
  # only for manual inspection and default away from the local-stack 80/443.
  chat-nginx-test:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: chat-nginx-test
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-test:/etc/nginx/ssl
      # Published attachments, streamed by nginx via the daemon's X-Accel-Redirect.
      - ../data/chat_attachments/published:/published:ro
    ports:
      - "${NGINX_TEST_HTTP_PORT:-8086}:80"
      - "${NGINX_TEST_HTTPS_PORT:-8446}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=chat-test
    depends_on:
      - chat-test
    profiles:
      - e2e
    networks:
      - hilos-chat-test-network

  chat-cli-test:
    build: .
    env_file:
      - ../tests/.env
    container_name: chat-cli-test
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - APP_ENV=test
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - hilos-chat-test-network

  # Playwright e2e runner. The official image ships the browsers — its version
  # tag MUST match `@playwright/test` in tests/e2e/package.json, otherwise
  # Playwright cannot locate its browser executables. BASE_URL points at the
  # in-network nginx, so the run never depends on host ports. No depends_on:
  # the stack is started explicitly via `composer run test:e2e-up`, never as a
  # side effect of running tests. node_modules installs onto the host
  # bind-mount (docs/agents/frontend/build-and-docker.md).
  chat-e2e-runner:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    container_name: chat-e2e-runner
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/chat/tests/e2e
    environment:
      BASE_URL: https://chat-nginx-test
      CI: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The admin-gating spec grants admin over the daemon command channel
      # (the CLI admin:grant wire) in-network, since the runner has no PHP.
      COMMAND_HOST: chat-test
      COMMAND_PORT: "8094"
    profiles:
      - e2e
    networks:
      - hilos-chat-test-network

volumes:
  mysql-test-data:
    name: hilos-chat-mysql-test-data
  nginx-ssl-test:

networks:
  hilos-chat-test-network:
    driver: bridge
