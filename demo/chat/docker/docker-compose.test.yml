# Docker Compose configuration for tests (unit, integration, Playwright)
# Isolated from dev stack (different ports, volumes, network)

name: hilos-chat-test

services:
  mysql-test:
    image: mariadb:11.4
    container_name: hilos-mysql-test
    ports:
      - "${MYSQL_TEST_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      MYSQL_USER: ${MYSQL_USER:-hilos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hilos_pass}
      TZ: UTC
    volumes:
      - mysql-test-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - hilos-chat-test-network

  chat-test:
    build: .
    env_file:
      - ../.env.test
    container_name: chat-daemon-test
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-test:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=test
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-7}
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      - CHAT_MODERATION_USERS=false
      - CHAT_MODERATION_BOTS=false
    command: ["php", "backend/Bootstrap/docker.php"]
    depends_on:
      mysql-test:
        condition: service_healthy
    ports:
      - "${HTTP_TEST_PORT:-8095}:8090"
      - "${WORKER_TEST_PORT:-8096}:8091"
      - "${WEBSOCKET_TEST_PORT:-8097}:8092"
    networks:
      - hilos-chat-test-network

  frontend-test:
    image: node:20-alpine
    container_name: chat-frontend-test
    working_dir: /app
    volumes:
      - ../frontend:/app
      - ../../../framework:/hilos/framework:ro
    environment:
      - VITE_WEBSOCKET_PORT=8097
    command: sh -c "npm ci && npm run build:docker && npx serve -s dist -l 5174"
    ports:
      - "${FRONTEND_TEST_PORT:-5174}:5174"
    networks:
      - hilos-chat-test-network

  chat-cli-test:
    build: .
    env_file:
      - ../.env.test
    container_name: chat-cli-test
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - APP_ENV=test
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_TEST_DATABASE:-hilos-demo-chat-test}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - hilos-chat-test-network

volumes:
  mysql-test-data:
    name: hilos-chat-mysql-test-data

networks:
  hilos-chat-test-network:
    driver: bridge
