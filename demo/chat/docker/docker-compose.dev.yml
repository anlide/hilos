# Docker Compose configuration for Chat Demo Project
# Load environment variables from .env file in project root
#
# Only this demo has a dev stack at all: tasks and simple-poll go local -> test -> prod.
# It is kept because it is the stand this demo's own development runs on, and adding the
# same stack to the others would be work nobody has asked for.

name: hilos-chat-dev

services:
  chat-dev:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-daemon-dev
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=dev
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke / protected-mode:open speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-13}
      # Mail goes to the stand's own interceptor, whose UI is published below, so
      # a message can be read with the eyes instead of dug out of a .eml file. The
      # transport is pinned rather than auto-selected: a stand that loses the
      # catcher should fail loudly, not fall back to writing files nobody opens.
      # The sender identity is NOT restated here — ../.env already carries it, and
      # a value written here would shadow that one without saying so.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-mailpit-dev}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      # SMS and Telegram go to the stand's own gateway, which mails them on to the
      # same interceptor (HIL-653). A non-empty SMS endpoint is what picks the
      # generic HTTP provider over the stub, so the message really travels; the
      # Telegram token is fake but non-empty, because the gateway refuses a call
      # that carries no bearer and a daemon without credentials should fail here.
      - SMS_ENDPOINT_URL=${SMS_ENDPOINT_URL:-http://stand-gateway-dev:18000/sms/send}
      - TELEGRAM_GATEWAY_ENDPOINT_URL=${TELEGRAM_GATEWAY_ENDPOINT_URL:-http://stand-gateway-dev:18000/telegram}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-stand-gateway-token}
      - TELEGRAM_GATEWAY_SENDER_USERNAME=${TELEGRAM_GATEWAY_SENDER_USERNAME:-HilosChat}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    expose:
      - "8090"
      - "8091"
    restart: unless-stopped
    networks:
      hilos-demo-chat-dev-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-172.26.0.11}

  # Mail interceptor for the dev stand: the daemon sends over SMTP to it and its
  # web UI is published on the host, so a verification code or a notification is
  # read where a person can see it (P-062). Development mail never leaves the box
  # — the catcher accepts everything and forwards nothing.
  mailpit-dev:
    image: axllent/mailpit:v1.21
    container_name: chat-mailpit-dev
    environment:
      # A development relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8028}:8025"
    restart: unless-stopped
    networks:
      - hilos-demo-chat-dev-network

  # The stand's gateway for every non-mail channel (HIL-653): the daemon points
  # its SMS and Telegram transports here, and everything the gateway catches it
  # forwards to mailpit-dev as a letter. That is the whole point — a code sent to
  # a phone is read in the browser beside the mailed ones, instead of being
  # unreachable on this stand. Not published on the host: it is talked to by the
  # daemon, and read through Mailpit's UI above.
  stand-gateway-dev:
    build:
      context: ../../../framework/docker/stand-gateway
    container_name: chat-stand-gateway-dev
    environment:
      MAILPIT_SMTP_HOST: mailpit-dev
      MAILPIT_SMTP_PORT: 1025
      TZ: UTC
    depends_on:
      - mailpit-dev
    restart: unless-stopped
    networks:
      - hilos-demo-chat-dev-network

  chat-cli-dev:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-cli-dev
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - APP_ENV=dev
      - TERM=xterm-256color
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.26.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - composer
    networks:
      - hilos-demo-chat-dev-network

  chat-monitor-dev:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-monitor-dev
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=dev
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.26.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - monitor
    restart: unless-stopped
    networks:
      - hilos-demo-chat-dev-network

networks:
  hilos-demo-chat-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.26.0.0/16}
