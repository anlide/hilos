# Vite dev server proxies /_hilos/file here so files are served like on test and prod:
# the daemon checks permissions and nginx streams from disk.
# The daemon's direct body is capped at 4 MiB while chat accepts up to 10 MiB (HIL-456).
# Internal network only. X-Real-IP is omitted because the daemon does not trust this address
# (HILOS_TRUSTED_PROXIES on local is chat-nginx-local only).

server {
    listen 80;

    location = /_hilos/file {
        proxy_pass http://chat-local:8090;
        proxy_set_header Host $host;
    }

    location ^~ /__hilos_files/ {
        internal;
        alias /published/;
    }
}
