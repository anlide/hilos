# Docker Compose configuration for LOCAL development.
# The full dev stack runs in Docker: MySQL, phpMyAdmin, the daemon, and the Vite
# frontend dev server (chat-frontend-local, HMR). `composer run daemon-start` brings
# the whole stack up; the chat-frontend-cli-local service (profile cli) runs on-demand
# npm commands (see the composer frontend:* scripts).
#
# Every ${...} below is compose *interpolation*, resolved before a container
# exists: it comes from the shell environment or from a `.env` next to this file
# (docker/.env, see docker/.env.example), NEVER from the demo's ../.env — that
# one is wired as `env_file` and only reaches container environments. A host-port
# override written into ../.env is silently ignored, so keep the defaults here
# usable as-is.

name: hilos-chat-local

services:
  # MySQL: inside the network use mysql-local:3306. From host use localhost:${MYSQL_HOST_PORT} (default 33060 for demo/chat).
  # To publish it on a different host port, set MYSQL_HOST_PORT in docker/.env (not ../.env).
  mysql-local:
    image: mariadb:11.4
    container_name: chat-mysql-local
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST in docker/.env to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-33060}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-chat}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - TZ=UTC
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-demo-chat-local-network:
        ipv4_address: ${DOCKER_MYSQL_IP:-172.26.0.10}

  phpmyadmin-local:
    image: phpmyadmin:latest
    container_name: chat-phpmyadmin-local
    environment:
      - PMA_HOST=mysql-local
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=256M
    depends_on:
      - mysql-local
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${PHPMYADMIN_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - hilos-demo-chat-local-network

  # Mail interceptor for the local stack: the daemon sends over SMTP to it and its
  # web UI is published on the host, so a verification code or a notification is
  # read where a person can see it (P-062). Local mail never leaves the box — the
  # catcher accepts everything and forwards nothing.
  mailpit-local:
    image: axllent/mailpit:v1.21
    container_name: chat-mailpit-local
    environment:
      # A local relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - hilos-demo-chat-local-network

  # The stand's gateway for every non-mail channel (HIL-653): the daemon points
  # its SMS and Telegram transports here, and everything the gateway catches it
  # forwards to mailpit-local as a letter. That is the whole point — a code sent
  # to a phone is read in the browser beside the mailed ones, instead of being
  # unreachable on a local stack. Not published on the host: it is talked to by
  # the daemon, and read through Mailpit's UI above.
  stand-gateway-local:
    build:
      context: ../../../framework/docker/stand-gateway
    container_name: chat-stand-gateway-local
    environment:
      MAILPIT_SMTP_HOST: mailpit-local
      MAILPIT_SMTP_PORT: 1025
      TZ: UTC
    depends_on:
      - mailpit-local
    restart: unless-stopped
    networks:
      - hilos-demo-chat-local-network

  # The daemon. Named after the demo rather than <demo>-daemon-local the way tasks and
  # simple-poll name theirs: the name is a deliberate difference between the stacks, kept
  # because renaming a service renames its container and every command that reaches for it.
  chat-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-daemon-local
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=local
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      # A bigger monopolistic pool than the other demos ask for: the number belongs to
      # this demo's own agent set, not to a framework norm. It is the agent COUNT,
      # because a monopolistic singleton needs a worker of its own - the thirteenth is
      # the sessions library every handshake is resolved in (HIL-710) and the fourteenth
      # is the notifications library that owns the notification tables (HIL-771).
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-15}
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: the websocket port below is published
      # as well, and a connection that reaches it without passing through nginx
      # arrives from the docker network's gateway - a peer that must never be
      # trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_NGINX_IP:-172.26.0.12}/32
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - DB_HOST=${DB_HOST:-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-chat}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      # Mail goes to the stack's own interceptor, whose UI is published above. The
      # transport is pinned rather than auto-selected: a stack that loses the
      # catcher should fail loudly, not fall back to writing .eml files nobody opens.
      # The sender identity is NOT restated here — ../.env already carries it, and
      # a value written here would shadow that one without saying so.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-mailpit-local}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      # SMS and Telegram go to the stack's own gateway, which mails them on to the
      # same interceptor (HIL-653). A non-empty SMS endpoint is what picks the
      # generic HTTP provider over the stub, so the message really travels; the
      # Telegram token is fake but non-empty, because the gateway refuses a call
      # that carries no bearer and a daemon without credentials should fail here.
      - SMS_ENDPOINT_URL=${SMS_ENDPOINT_URL:-http://stand-gateway-local:18000/sms/send}
      - TELEGRAM_GATEWAY_ENDPOINT_URL=${TELEGRAM_GATEWAY_ENDPOINT_URL:-http://stand-gateway-local:18000/telegram}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-stand-gateway-token}
      - TELEGRAM_GATEWAY_SENDER_USERNAME=${TELEGRAM_GATEWAY_SENDER_USERNAME:-HilosChat}
      - LLM_LOCAL_URL=${LLM_LOCAL_URL:-http://host.docker.internal:11434}
      - CHAT_CONTEXT_ANALYZER_URL=${CHAT_CONTEXT_ANALYZER_URL:-}
      - CHAT_CONTEXT_ANALYZER_MODEL=${CHAT_CONTEXT_ANALYZER_MODEL:-qwen2.5:7b}
      - CHAT_CONTEXT_ANALYZER_TIMEOUT_SEC=${CHAT_CONTEXT_ANALYZER_TIMEOUT_SEC:-90.0}
      - CHAT_CONTEXT_ANALYZER_PROVIDER=${CHAT_CONTEXT_ANALYZER_PROVIDER:-local}
      - FRONTEND_HTML_HOST=0.0.0.0
      - FRONTEND_HTML_PORT=8093
      - FRONTEND_DIST_PATH=${FRONTEND_DIST_PATH:-/app/frontend/dist}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - mysql-local
      - mailpit-local
      - stand-gateway-local
    ports:
      # Expose ports to host for local frontend access
      - "${HILOS_BIND_HOST:-127.0.0.1}:${HTTP_STATUS_PORT:-8090}:8090"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WORKER_COMM_PORT:-8091}:8091"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WEBSOCKET_PORT:-8092}:8092"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${FRONTEND_HTML_PORT:-8093}:8093"
    restart: unless-stopped
    networks:
      hilos-demo-chat-local-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-172.26.0.11}

  # On-demand CLI container. Sits behind the `composer` profile, not the `cli` one the other
  # demos use: the composer scripts of this demo name it that way, and the profile is a word
  # in those scripts rather than anything the framework reads.
  chat-cli-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-cli-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - APP_ENV=local
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.26.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
      - DB_HOST=${DB_HOST:-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-chat}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - composer
    depends_on:
      - mysql-local
    networks:
      - hilos-demo-chat-local-network

  # The live monitor view. Only this demo ships one, and only behind a profile, so it starts
  # when someone asks for it and never with the stack.
  chat-monitor-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: chat-monitor-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../../../scripts:/hilos/scripts:ro
    working_dir: /app
    environment:
      - APP_ENV=local
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.26.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - monitor
    networks:
      - hilos-demo-chat-local-network

  chat-nginx-local:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: chat-nginx-local
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-local:/etc/nginx/ssl
    ports:
      # HTTPS only. The container's own :80 vhost stays unpublished on purpose —
      # it 301s to https://$host with the port dropped, which lands on whatever
      # holds 443 (another demo's stack), not here. Reach this stack over HTTPS.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=chat-local
    depends_on:
      - chat-local
    restart: unless-stopped
    profiles:
      - full
    networks:
      hilos-demo-chat-local-network:
        ipv4_address: ${DOCKER_NGINX_IP:-172.26.0.12}

  # Vite dev server with HMR for the chat frontend. No profile: it is part of the
  # default local stack, so `daemon-start` brings it up with the backend. Mounts the
  # whole repo at /hilos so the @hilos/vue `file:` symlink into framework/frontend
  # resolves, and runs npm install first so a fresh checkout or an SDK re-vendor is
  # picked up. Native WSL2 filesystem events drive HMR — no polling (see vite.config.ts).
  chat-frontend-local:
    image: node:22-bookworm-slim
    container_name: chat-frontend-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/chat/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The dev page is served by Vite, not nginx, so the app's same-origin
      # /ws default cannot reach the daemon; point it at the published
      # WebSocket port instead (see frontend/src/connection.ts).
      VITE_WS_URL: "ws://localhost:${WEBSOCKET_PORT:-8092}"
      # Attachment downloads proxy same-origin (Vite → daemon) so the session
      # cookie rides along; in-network the daemon's HTTP router is chat-local:8090.
      VITE_ATTACHMENT_TARGET: "http://chat-local:8090"
    command: sh -c "npm install && npm run dev"
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${FRONTEND_DEV_PORT:-5173}:5173"
    restart: unless-stopped
    networks:
      - hilos-demo-chat-local-network

  # On-demand Node toolchain for the chat frontend (npm install / build / check).
  # Profile cli so it never starts with the stack — invoked per command via
  # `run --rm` (see the composer frontend:* scripts).
  chat-frontend-cli-local:
    image: node:22-bookworm-slim
    container_name: chat-frontend-cli-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/chat/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - cli

volumes:
  nginx-ssl-local:

networks:
  hilos-demo-chat-local-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.26.0.0/16}
