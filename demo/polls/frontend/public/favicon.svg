<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">Hilos Polls — bar chart</title>
  <desc id="desc">A purple bar chart. In the bottom-right corner, a plain blue dot.</desc>
  <!-- HIL-2151: the small sign of the polls demo.
       Redrawn in HIL-2261 with the mark in the bottom-right corner.
       Symbol: original geometry for HIL-2261, three bars after icons/bar-chart-fill.svg.
       Corner mark: the Hilos logo, original geometry. MIT; see ../README.md. -->
  <mask id="hilos-mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="25" cy="25" r="9" fill="#000"/>
  </mask>
  <g id="demo-symbol" fill="#AE3EC9" mask="url(#hilos-mark-gap)">
    <rect x="0" y="18" width="6" height="10" rx="1"/>
    <rect x="8" y="10" width="6" height="18" rx="1"/>
    <rect x="16" y="0" width="6" height="28" rx="1"/>
  </g>
  <g id="hilos-mark">
    <circle cx="25" cy="25" r="7" fill="#0288D1"/>
  </g>
</svg>
