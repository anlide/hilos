# Docker Compose configuration for the DEV stack of the polls demo.
# Load environment variables from .env file in project root
#
# Every reference demo - chat, tasks and polls - carries a dev stack of this one shape
# (HIL-1033), so a step that says "every stack's compose" means
# docker-compose.{local,dev,test}.yml in each of them (docs/agents/stand-services.md).
# The shape is the daemon with the stand's own mail catcher and channel gateway, plus
# the cli and monitor behind profiles. There is no database and no frontend: the
# daemon connects to the database ../.env names, and until one answers the container
# retries, gives up and restarts, so without it this stack runs no daemon at all. The
# subnet is the demo's own, shared with its local and prod stacks: this stack runs
# instead of them, not beside them.

name: hilos-polls-dev

services:
  # Mail interceptor for the dev stack, kept identical across the three demos so
  # a stack is never a special case (P-062). Its web UI is published on the host,
  # so a message is read where a person can see it. This demo mails nothing today
  # — it activates NOTIFICATIONS without NOTIFICATION_DELIVERY — so the catcher is
  # here for the day it does, and meanwhile it gives a stray message somewhere to
  # land other than the work tree.
  polls-mailpit-dev:
    image: axllent/mailpit:v1.21
    container_name: polls-mailpit-dev
    environment:
      # A local relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8030}:8025"
    restart: unless-stopped
    networks:
      - hilos-polls-dev-network

  # The stack's gateway for every non-mail channel (HIL-492, HIL-653): the daemon
  # points its SMS and Telegram transports here, and everything the gateway catches
  # it forwards to polls-mailpit-dev as a letter. That is the whole point - a code
  # sent to a phone is read in the browser beside the mailed ones, instead of being
  # unreachable on a dev stack. Not published on the host: it is talked to by the
  # daemon, and read through Mailpit's UI above.
  polls-stand-gateway-dev:
    build:
      context: ../../../framework/docker/stand-gateway
    container_name: polls-stand-gateway-dev
    # The gateway runs on the framework's own TLS server (HIL-921) and loads the
    # classes it needs from the framework itself, so there is still no composer here.
    volumes:
      - ../../../framework:/hilos/framework:ro
    environment:
      MAILPIT_SMTP_HOST: polls-mailpit-dev
      MAILPIT_SMTP_PORT: 1025
      TZ: UTC
    depends_on:
      - polls-mailpit-dev
    restart: unless-stopped
    networks:
      # One name in every stack, and the name the gateway's certificate is issued
      # for (HIL-921): the daemon checks the name of the peer it reaches, so the
      # service name, which differs from stack to stack, cannot be the address.
      hilos-polls-dev-network:
        aliases:
          - stand-gateway

  # The Hilos daemon. It has no database of its own: ../.env names one, or the
  # container retries the connection, gives up and restarts (see the header).
  polls-daemon-dev:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: polls-daemon-dev
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs-dev:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=dev
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke / protected-mode:open speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      # Mail goes to the stack's own interceptor, whose UI is published above. The
      # transport is pinned rather than auto-selected: a stack that loses the
      # catcher should fail loudly, not fall back to writing .eml files nobody opens.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-polls-mailpit-dev}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-notifications@polls.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Hilos Polls}
      # SMS and Telegram go to the stack's own gateway, which mails them on to the
      # same interceptor (HIL-653). A non-empty SMS endpoint is what picks the
      # generic HTTP provider over the stub, so the message really travels; the
      # Telegram token is fake but non-empty, because the gateway refuses a call
      # that carries no bearer and a daemon without credentials should fail here.
      - SMS_ENDPOINT_URL=${SMS_ENDPOINT_URL:-https://stand-gateway:18000/sms/send}
      - TELEGRAM_GATEWAY_ENDPOINT_URL=${TELEGRAM_GATEWAY_ENDPOINT_URL:-https://stand-gateway:18000/telegram}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-stand-gateway-token}
      - TELEGRAM_GATEWAY_SENDER_USERNAME=${TELEGRAM_GATEWAY_SENDER_USERNAME:-HilosPolls}
      # The gateway answers over TLS with the stand's own certificate (HIL-921), and the
      # daemon verifies it the way it verifies a provider in production: the trust comes
      # from the environment, not from a switch in the client. OpenSSL reads this file
      # beside the system's certificate directory, so every other peer stays trusted.
      - SSL_CERT_FILE=/hilos/framework/docker/stand-gateway/tls/ca.pem
      # Where a mailed sign-in link comes back to (HIL-417). This stack serves no
      # frontend, but the framework default names port 5173 - the chat demo's - so
      # the link names this demo's own local dev server instead of another application.
      - HILOS_MAGIC_LINK_URL=${HILOS_MAGIC_LINK_URL:-http://localhost:5175/auth/magic}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - polls-mailpit-dev
      - polls-stand-gateway-dev
    expose:
      - "8090"
      - "8091"
    restart: unless-stopped
    networks:
      hilos-polls-dev-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-10.198.0.11}

  polls-cli-dev:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: polls-cli-dev
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=dev
      # The daemon's trust in the stand gateway's certificate (HIL-921), so a command
      # that reaches the gateway from here verifies it the same way.
      - SSL_CERT_FILE=/hilos/framework/docker/stand-gateway/tls/ca.pem
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-10.198.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - cli
    networks:
      - hilos-polls-dev-network

  polls-monitor-dev:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: polls-monitor-dev
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=dev
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-10.198.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
    profiles:
      - monitor
    networks:
      - hilos-polls-dev-network

networks:
  hilos-polls-dev-network:
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 - Docker's default
        # address pools. The cli and monitor containers need a fixed daemon address
        # (they reach it by that address and nothing else), so this subnet is claimed,
        # not assigned. Inside a default pool that claim loses a race: any other stack
        # whose network came up first may already hold the range, and then the stand
        # fails to start with "Pool overlaps with other one on this address space".
        # 10.0.0.0/8 is never auto-assigned
        # (demo/cluster/docker/docker-compose.cluster.yml).
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.198.0.0/16}
