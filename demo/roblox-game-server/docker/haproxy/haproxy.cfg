# The one address of the cluster stand's database: the nodes and the cli know only this, and it
# hands their connections out over the two data members of the Galera cluster, so both are
# written to. The garbd arbitrator is no server here: it answers no SQL.
#
# The addresses come from the environment of the proxy's service (cluster/haproxy.yml), read here
# inside double quotes; "${NAME[*]}" expands a list separated by spaces into one argument each.
#
# No log directive: a line per connection is not wanted, and a server changing state is said on
# stderr anyway, which is what `docker logs` shows.

defaults
    mode tcp
    # Just after a member dies, its connections are refused before the health check marks it
    # DOWN. Redispatch a refused connection to a live member.
    retries 3
    option redispatch 1
    timeout connect 2s
    # 8h = MariaDB's default wait_timeout (28800 s): a shorter idle timeout would have the proxy
    # cut daemon connections the server keeps. A node reconnects through this address when its
    # member dies (HIL-1231).
    timeout client 8h
    timeout server 8h

# Healthy only while both data members are up behind the proxy: the nodes wait for this before
# they start, since a connection taken with no member behind it reaches them as error 2013. The
# stats page is where the harness reads each server's state.
frontend health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    monitor fail if { nbsrv(galera) lt 2 }
    stats enable
    stats uri /stats

listen galera
    bind :3306
    balance leastconn
    # The agent (framework/docker/galera/agent.sh) says up while Synced or donating: down members
    # take no new connections, while connections already open to a member are left alone.
    default-server check inter 1s rise 2 fall 2 agent-check agent-port 9200 agent-inter 1s
    # Each node of the stand has a data member of its own: a row one node writes must be read by a
    # node on the OTHER data member, and with two members and the connections laid out by
    # leastconn alone, every node could end up on the same one. So m1 and m3 go to galera1, m2 and
    # s1 to galera2, and each member always carries two nodes. A rule naming a server that is
    # DOWN is passed over (there is no "option persist" here), and the connection goes to the
    # living member by leastconn, as every other client's does - the cli's among them.
    acl to_galera1 src "${HILOS_DB_CLIENTS_1[*]}"
    acl to_galera2 src "${HILOS_DB_CLIENTS_2[*]}"
    use-server roblox-game-server-cluster-galera1 if to_galera1
    use-server roblox-game-server-cluster-galera2 if to_galera2
    # Server names are the services' names: the harness matches the states it reads here to the
    # data members by them.
    server roblox-game-server-cluster-galera1 "${HILOS_DB_MEMBER_1}:3306"
    server roblox-game-server-cluster-galera2 "${HILOS_DB_MEMBER_2}:3306"
