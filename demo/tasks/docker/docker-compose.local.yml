# Docker Compose configuration for LOCAL development.
# The full dev stack runs in Docker: MySQL, phpMyAdmin, the daemon, and the Vite
# frontend dev server (tasks-frontend-local, HMR). `composer run daemon-start`
# brings the whole stack up; the cli services (profile cli) run on-demand
# commands (see the composer scripts).
#
# Port plan: the daemon binds fixed in-container ports (8090 status / 8091
# worker comm / 8092 websocket, same as every demo — the nginx template proxies
# /ws to :8092); only the host-side publishes shift per demo so the stacks run
# side by side (chat holds 8090-8097, tasks takes 8098-8103).
#
# Every ${...} below is compose *interpolation*, resolved before a container
# exists: it comes from the shell environment or from a `.env` next to this file
# (docker/.env, see docker/.env.example), NEVER from the demo's ../.env — that
# one is wired as `env_file` and only reaches container environments. A host-port
# override written into ../.env is silently ignored, so keep the defaults here
# usable as-is.

name: hilos-tasks-local

services:
  # MySQL: inside the network use tasks-mysql-local:3306. From host use
  # localhost:${MYSQL_HOST_PORT} (default 33063 — 33060-33062 belong to
  # chat-local, chat-test, and the framework test stack).
  tasks-mysql-local:
    image: mariadb:11.4
    container_name: tasks-mysql-local
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST in docker/.env to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-33063}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-tasks}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - TZ=UTC
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-tasks-local-network:
        ipv4_address: ${DOCKER_MYSQL_IP:-172.27.0.10}

  tasks-phpmyadmin-local:
    image: phpmyadmin:latest
    container_name: tasks-phpmyadmin-local
    environment:
      - PMA_HOST=tasks-mysql-local
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=256M
    depends_on:
      - tasks-mysql-local
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${PHPMYADMIN_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - hilos-tasks-local-network

  # Mail interceptor for the local stack, kept identical across the three demos so
  # a stack is never a special case (P-062). Its web UI is published on the host,
  # so a message is read where a person can see it. This demo mails nothing today
  # — it activates NOTIFICATIONS without NOTIFICATION_DELIVERY — so the catcher is
  # here for the day it does, and meanwhile it gives a stray message somewhere to
  # land other than the work tree.
  tasks-mailpit-local:
    image: axllent/mailpit:v1.21
    container_name: tasks-mailpit-local
    environment:
      # A local relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8026}:8025"
    restart: unless-stopped
    networks:
      - hilos-tasks-local-network

  # The stack's gateway for every non-mail channel (HIL-492, HIL-653): the daemon
  # points its SMS and Telegram transports here, and everything the gateway catches
  # it forwards to tasks-mailpit-local as a letter. That is the whole point - a code
  # sent to a phone is read in the browser beside the mailed ones, instead of being
  # unreachable on a local stack. Not published on the host: it is talked to by the
  # daemon, and read through Mailpit's UI above.
  tasks-stand-gateway-local:
    build:
      context: ../../../framework/docker/stand-gateway
    container_name: tasks-stand-gateway-local
    environment:
      MAILPIT_SMTP_HOST: tasks-mailpit-local
      MAILPIT_SMTP_PORT: 1025
      TZ: UTC
    depends_on:
      - tasks-mailpit-local
    restart: unless-stopped
    networks:
      - hilos-tasks-local-network

  # The Hilos daemon. The .env file is optional at the compose level: nothing
  # creates it for you, and a fresh checkout starts without one - the values
  # come from this stack and, for anything it does not name, from .env.example.
  tasks-daemon-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: tasks-daemon-local
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=local
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke / protected-mode:open speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke /
      # protected-mode:open) reaches the command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - DB_HOST=${DB_HOST:-tasks-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-tasks}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      # Seven monopolistic workers, one per monopolistic singleton: the tasks agent,
      # the Hilos dashboard's hilos_index agent the shell gear subscribes, the
      # sessions library that resolves every handshake (HIL-710), the notifications
      # library that owns the notification tables (HIL-771), and the three sign-in
      # turned on here (HIL-623) - the users library, the OAuth agent and the code
      # agent. A monopolistic singleton needs a worker of its own, so the
      # pool is the agent count: one short and a handshake or a sign-in is
      # addressed to an agent that never comes up. The pooled delivery channels
      # (mail, SMS) and the node-scoped throttle agent are NOT among them - they
      # run on regular workers. The framework default gives two, but the demos
      # prescribe it here (like chat) so the pool is explicit and not at the mercy
      # of env drift.
      - WORKER_MIN_MONOPOLISTIC=${WORKER_MIN_MONOPOLISTIC:-7}
      # Mail goes to the stack's own interceptor, whose UI is published above. The
      # transport is pinned rather than auto-selected: a stack that loses the
      # catcher should fail loudly, not fall back to writing .eml files nobody opens.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-tasks-mailpit-local}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-notifications@tasks.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Hilos Tasks}
      # SMS and Telegram go to the stack's own gateway, which mails them on to the
      # same interceptor (HIL-653). A non-empty SMS endpoint is what picks the
      # generic HTTP provider over the stub, so the message really travels; the
      # Telegram token is fake but non-empty, because the gateway refuses a call
      # that carries no bearer and a daemon without credentials should fail here.
      - SMS_ENDPOINT_URL=${SMS_ENDPOINT_URL:-http://tasks-stand-gateway-local:18000/sms/send}
      - TELEGRAM_GATEWAY_ENDPOINT_URL=${TELEGRAM_GATEWAY_ENDPOINT_URL:-http://tasks-stand-gateway-local:18000/telegram}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-stand-gateway-token}
      - TELEGRAM_GATEWAY_SENDER_USERNAME=${TELEGRAM_GATEWAY_SENDER_USERNAME:-HilosTasks}
      # Where a mailed sign-in link comes back to (HIL-417). Overridden rather than
      # inherited: the framework default names port 5173, and this stack publishes
      # its dev server on 5174 so it can run beside the chat one - so the default
      # would mail a person a link into another application's front end.
      - HILOS_MAGIC_LINK_URL=${HILOS_MAGIC_LINK_URL:-http://localhost:5174/auth/magic}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - tasks-mysql-local
      - tasks-mailpit-local
      - tasks-stand-gateway-local
    ports:
      # Host-side publishes: container ports stay fixed, the host side shifts
      # per the demo port plan so several stacks run side by side.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${HTTP_STATUS_HOST_PORT:-8098}:8090"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WORKER_COMM_HOST_PORT:-8099}:8091"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WEBSOCKET_HOST_PORT:-8100}:8092"
    restart: unless-stopped
    networks:
      hilos-tasks-local-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-172.27.0.11}

  tasks-cli-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: tasks-cli-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=local
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-172.27.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
      - DB_HOST=${DB_HOST:-tasks-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-tasks}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      - tasks-mysql-local
    networks:
      - hilos-tasks-local-network

  # Prod-parity nginx over the BUILT frontend artifact (profile full — only
  # `daemon-start-build` starts it; the dev loop uses the Vite server instead).
  tasks-nginx-local:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tasks-nginx-local
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx-ssl-local:/etc/nginx/ssl
    ports:
      # HTTPS only. The container's own :80 vhost stays unpublished on purpose —
      # it 301s to https://$host with the port dropped, which lands on whatever
      # holds 443 (another demo's stack), not here. Reach this stack over HTTPS.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_HTTPS_PORT:-444}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=tasks-daemon-local
    depends_on:
      - tasks-daemon-local
    restart: unless-stopped
    profiles:
      - full
    networks:
      - hilos-tasks-local-network

  # Vite dev server with HMR for the tasks frontend. Mounts the whole repo
  # at /hilos so the @hilos/react `file:` symlink into framework/frontend
  # resolves, and runs npm install first so a fresh checkout or an SDK re-vendor
  # is picked up. Native WSL2 filesystem events drive HMR — no polling (see
  # frontend/vite.config.ts). The host port defaults away from the chat demo's
  # 5173 so both local stacks can run side by side.
  tasks-frontend-local:
    image: node:22-bookworm-slim
    container_name: tasks-frontend-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/tasks/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The dev page is served by Vite, not nginx, so the app's same-origin
      # /ws default cannot reach the daemon; point it at the published
      # WebSocket port instead (see frontend/src/connection.ts).
      VITE_WS_URL: "ws://localhost:${WEBSOCKET_HOST_PORT:-8100}"
    command: sh -c "npm install && npm run dev"
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${FRONTEND_DEV_PORT:-5174}:5173"
    restart: unless-stopped
    networks:
      - hilos-tasks-local-network

  # On-demand Node toolchain for the tasks frontend (npm install / build /
  # check). Profile cli so it never starts with the stack — invoked per command
  # via `run --rm` (see the composer frontend:* scripts).
  tasks-frontend-cli-local:
    image: node:22-bookworm-slim
    container_name: tasks-frontend-cli-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/tasks/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - cli
    networks:
      - hilos-tasks-local-network

volumes:
  nginx-ssl-local:

networks:
  hilos-tasks-local-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.27.0.0/16}
