server {
    listen 80;

    # Public Status files: exact names only; never ask the daemon.
    # Repeat security headers because add_header replaces inherited headers.
    location = /status-data/status.json {
        alias /status/status.json;
        default_type application/json;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    location = /status-data/heartbeat.json {
        alias /status/heartbeat.json;
        default_type application/json;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    location = /status-data {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        return 404;
    }
    location ^~ /status-data/ {
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        return 404;
    }

    location = /_hilos/file {
        proxy_pass http://tasks-daemon-local:8090;
        proxy_set_header Host $host;
    }

    location ^~ /__hilos_files/ {
        internal;
        alias /published/;
    }
}
