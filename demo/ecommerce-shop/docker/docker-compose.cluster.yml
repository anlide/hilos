# The cluster stand of ecommerce-shop (HIL-1216): one master and two slaves of unequal room
# on one MariaDB server with the primary database and its derived journal (HIL-1453).
#
# One shared primary database for the whole stand (HIL-712) — the model
# Hilos is built on, and what makes "node A writes a row, node B reads it" sayable —
# three daemon nodes that roll that schema out themselves as they start together,
# under the rollout claim in the database (HIL-1228), on a dedicated bridge with
# static IPs — one master, the whole master set, so it leads for as long as it lives
# (placement and failover are proved where the leader is stable, the owner's word,
# 2026-09-27), and two data-plane slaves (the placement targets) — and a long-lived
# CLI container the shared cluster harness `docker exec`s to run `test:cluster:inspect`
# against each node. Node role, identity, capabilities, master set, and timeouts all
# come from CLUSTER_* env, so the same image is a master or a data-plane node purely
# by configuration.
#
# A compose project of its own, beside the demo's local and test stacks rather than inside
# one of them: the demo's e2e steps take their whole project down when they start, and a
# fleet inside it would fall in the middle of its matrix. The nodes run the whole demo —
# every agent it registers, the framework's cluster probes among them — and publish nothing
# on the host: the harness reaches them through the cli container.

name: hilos-ecommerce-shop-cluster${HILOS_STAND_SUFFIX:-}

# What the shared cluster harness (framework/docker/cluster/cluster.py) reads besides the services
# below; the nodes, their addresses, roles, room and log directories it takes from the services.
x-hilos-cluster:
  cli: ecommerce-shop-cluster-cli
  scenarios: [3, 4, 6, 9, 12, 14, 16, 18, 19, 37, 39, 43]

include:
  - path:
      - ./cluster/local.yml
      - ./cluster/tooling.yml
