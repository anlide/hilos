# Docker Compose configuration for LOCAL development.
# The full dev stack runs in Docker: MySQL, phpMyAdmin, Mailpit, the daemon, and
# the Vite frontend dev server (ecommerce-shop-frontend-local, HMR).
# `composer run daemon-start` brings the whole stack up; the cli services
# (profile cli) run on-demand commands (see the composer scripts).
#
# Port plan: the daemon binds fixed in-container ports (8090 status / 8091
# worker comm / 8092 websocket, same as every demo — the nginx template proxies
# /ws to :8092); only the host-side publishes shift per demo so the stacks run
# side by side. This demo holds the 8130–8149 block
# (docs/new-project/README.md, "Ports").
#
# Every ${...} below is compose *interpolation*, resolved before a container
# exists: it comes from the shell environment or from a `.env` next to this file
# (docker/.env, see docker/.env.example), NEVER from the demo's ../.env — that
# one is wired as `env_file` and only reaches container environments. A host-port
# override written into ../.env is silently ignored, so keep the defaults here
# usable as-is.

name: hilos-ecommerce-shop-local

services:
  # MySQL: inside the network use ecommerce-shop-mysql-local:3306. From host
  # use localhost:${MYSQL_HOST_PORT} (default 33069).
  ecommerce-shop-mysql-local:
    image: mariadb:11.4
    container_name: ecommerce-shop-mysql-local
    ports:
      # Host-side of every publish binds to loopback by default; set
      # HILOS_BIND_HOST in docker/.env to expose this stack to a LAN/tailnet.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-33069}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hilos-demo-ecommerce-shop}
      - MYSQL_USER=${MYSQL_USER:-hilos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      - TZ=UTC
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --skip-character-set-client-handshake
    restart: unless-stopped
    networks:
      hilos-ecommerce-shop-local-network:
        ipv4_address: ${DOCKER_MYSQL_IP:-10.202.0.10}

  ecommerce-shop-phpmyadmin-local:
    image: phpmyadmin:latest
    container_name: ecommerce-shop-phpmyadmin-local
    environment:
      - PMA_HOST=ecommerce-shop-mysql-local
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-hilos_root_pass}
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=256M
    depends_on:
      - ecommerce-shop-mysql-local
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${PHPMYADMIN_PORT:-8139}:80"
    restart: unless-stopped
    networks:
      - hilos-ecommerce-shop-local-network

  # Mail interceptor for the local stack. Every code this demo sends - the
  # address check of a registration and the code of a recovery - leaves by mail,
  # and its web UI is published on the host, so a code is read where a person
  # can see it.
  ecommerce-shop-mailpit-local:
    image: axllent/mailpit:v1.21
    container_name: ecommerce-shop-mailpit-local
    environment:
      # A local relay authenticates nobody and encrypts nothing; the daemon
      # connects with MAIL_SMTP_SECURITY=none and no credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8140}:8025"
    restart: unless-stopped
    networks:
      - hilos-ecommerce-shop-local-network

  # The Hilos daemon. The .env file is optional at the compose level: nothing
  # creates it for you, and a fresh checkout starts without one - the values
  # come from this stack and, for anything it does not name, from .env.example.
  ecommerce-shop-daemon-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: ecommerce-shop-daemon-local
    volumes:
      - ..:/app
      # Mount framework package to /hilos for composer path repository
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
      - ../data/logs:/var/log/hilos
    working_dir: /app
    environment:
      - APP_ENV=local
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
      - HTTP_STATUS_HOST=0.0.0.0
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_HOST=0.0.0.0
      - WORKER_COMM_PORT=8091
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8092
      # Trust this stand's own nginx, by address, to name the visitor behind it
      # (HIL-680). One address and not a pool: the websocket port below is published
      # as well, and a connection that reaches it without passing through nginx
      # arrives from the docker network's gateway - a peer that must never be
      # trusted to name anyone.
      - HILOS_TRUSTED_PROXIES=${DOCKER_NGINX_IP:-10.202.0.12}/32
      # The CLI command channel, the socket admin:create / admin:grant /
      # admin:revoke speak.
      - COMMAND_HOST=0.0.0.0
      - COMMAND_PORT=8094
      # The daemon addresses itself, so an operator command run with `docker exec`
      # in this container (admin:create / admin:grant / admin:revoke) reaches the
      # command channel over loopback.
      - HILOS_DAEMON_HOST=127.0.0.1
      - DB_HOST=${DB_HOST:-ecommerce-shop-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-ecommerce-shop}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
      # Mail goes to the stack's own interceptor, whose UI is published above. The
      # transport is pinned rather than auto-selected: a stack that loses the
      # catcher should fail loudly, not fall back to writing .eml files nobody opens.
      - MAIL_TRANSPORT=smtp
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-ecommerce-shop-mailpit-local}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-1025}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-none}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-notifications@ecommerce-shop.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Hilos Flowers}
    command: ["php", "backend/Bootstrap/docker.php"]
    stop_grace_period: 25s
    depends_on:
      - ecommerce-shop-mysql-local
      - ecommerce-shop-mailpit-local
    ports:
      # Host-side publishes: container ports stay fixed, the host side shifts
      # per the demo port plan so several stacks run side by side.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${HTTP_STATUS_HOST_PORT:-8130}:8090"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WORKER_COMM_HOST_PORT:-8131}:8091"
      - "${HILOS_BIND_HOST:-127.0.0.1}:${WEBSOCKET_HOST_PORT:-8132}:8092"
    restart: unless-stopped
    networks:
      hilos-ecommerce-shop-local-network:
        ipv4_address: ${DOCKER_DAEMON_IP:-10.202.0.11}

  ecommerce-shop-cli-local:
    build: .
    env_file:
      - path: ../.env
        required: false
    container_name: ecommerce-shop-cli-local
    volumes:
      - ..:/app
      - ../../../composer.json:/hilos/composer.json:ro
      - ../../../composer.lock:/hilos/composer.lock:ro
      - ../../../framework:/hilos/framework:ro
    working_dir: /app
    environment:
      - APP_ENV=local
      - TERM=xterm-256color
      - DOCKER=true
      - HILOS_DAEMON_HOST=${DOCKER_DAEMON_IP:-10.202.0.11}
      - HTTP_STATUS_PORT=8090
      - WORKER_COMM_PORT=8091
      - COMMAND_PORT=8094
      - DB_HOST=${DB_HOST:-ecommerce-shop-mysql-local}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${MYSQL_DATABASE:-hilos-demo-ecommerce-shop}
      - DB_USERNAME=${MYSQL_USER:-hilos}
      - DB_PASSWORD=${MYSQL_PASSWORD:-hilos_pass}
    profiles:
      - cli
    depends_on:
      - ecommerce-shop-mysql-local
    networks:
      - hilos-ecommerce-shop-local-network

  # Prod-parity nginx over the BUILT frontend artifact (profile full — only
  # `daemon-start-build` starts it; the dev loop uses the Vite server instead).
  ecommerce-shop-nginx-local:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: ecommerce-shop-nginx-local
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../data/data_export:/data_export:ro
      - nginx-ssl-local:/etc/nginx/ssl
    ports:
      # HTTPS only. The container's own :80 vhost stays unpublished on purpose —
      # it 301s to https://$host with the port dropped, which lands on whatever
      # holds 443 (another demo's stack), not here. Reach this stack over HTTPS.
      - "${HILOS_BIND_HOST:-127.0.0.1}:${NGINX_HTTPS_PORT:-8136}:443"
    environment:
      - FRONTEND_HTML_UPSTREAM=ecommerce-shop-daemon-local
    depends_on:
      - ecommerce-shop-daemon-local
    restart: unless-stopped
    profiles:
      - full
    networks:
      hilos-ecommerce-shop-local-network:
        ipv4_address: ${DOCKER_NGINX_IP:-10.202.0.12}

  # Vite dev server with HMR for the frontend. Mounts the whole repo at /hilos so
  # the @hilos/react `file:` symlink into framework/frontend resolves, and runs npm
  # install first so a fresh checkout or an SDK re-vendor is picked up. The host
  # port is this demo's own, so every local stack can run side by side.
  ecommerce-shop-frontend-local:
    image: node:22-bookworm-slim
    container_name: ecommerce-shop-frontend-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/ecommerce-shop/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: sh -c "npm install && npm run dev"
    ports:
      - "${HILOS_BIND_HOST:-127.0.0.1}:${FRONTEND_DEV_PORT:-5177}:5173"
    restart: unless-stopped
    networks:
      - hilos-ecommerce-shop-local-network

  # On-demand Node toolchain for the frontend (npm install / build / check).
  # Profile cli so it never starts with the stack — invoked per command via
  # `run --rm` (see the composer frontend:* scripts).
  ecommerce-shop-frontend-cli-local:
    image: node:22-bookworm-slim
    container_name: ecommerce-shop-frontend-cli-local
    volumes:
      - ../../..:/hilos
    working_dir: /hilos/demo/ecommerce-shop/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    profiles:
      - cli
    networks:
      - hilos-ecommerce-shop-local-network

volumes:
  nginx-ssl-local:

networks:
  hilos-ecommerce-shop-local-network:
    driver: bridge
    ipam:
      config:
        # Deliberately outside 172.16.0.0/12 and 192.168.0.0/16 - Docker's default
        # address pools. nginx needs a fixed address (the daemon trusts it by that
        # address and nothing else), so this subnet is claimed, not assigned. Inside
        # a default pool that claim loses a race: any other stack whose network came
        # up first may already hold the range, and then the stand fails to start with
        # "Pool overlaps with other one on this address space". 10.0.0.0/8 is never
        # auto-assigned; the column of this demo is 10.2x2
        # (docs/new-project/README.md).
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.202.0.0/16}
