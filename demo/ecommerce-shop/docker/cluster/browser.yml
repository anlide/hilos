x-seeded: &seeded
  ecommerce-shop-cluster-seed:
    condition: service_completed_successfully

services:
  ecommerce-shop-cluster-mysql:
    volumes:
      - ./init-browser-seed.sh:/docker-entrypoint-initdb.d/init-browser-seed.sh:ro

  ecommerce-shop-cluster-seed:
    extends: {file: ./tooling.yml, service: ecommerce-shop-cluster-cli}
    container_name: ecommerce-shop-cluster-seed${HILOS_STAND_SUFFIX:-}
    environment:
      HILOS_DAEMON_HOST: ecommerce-shop-cluster-m1
      COMMAND_PORT: "8094"
      HILOS_TEST_OWN_DIRS: /hilos-test-logs /stand-seed
    volumes:
      - ${HILOS_CLUSTER_DB_DATA_DIR:-/dev/shm/hilos-ecommerce-shop-cluster-mysql-data${HILOS_STAND_SUFFIX:-}}/.browser-seed:/stand-seed
    command: [sh, docker/cluster/browser-seed.sh]

  ecommerce-shop-cluster-m1:
    env_file:
      - ./browser.env
    environment:
      CLUSTER_SEEDS: 10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.12:8095,10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.14:8095,10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.15:8095
    depends_on: *seeded

  ecommerce-shop-cluster-m2:
    extends: {file: ./node.yml, service: node}
    container_name: ecommerce-shop-cluster-m2${HILOS_STAND_SUFFIX:-}
    entrypoint: [sh, /hilos/framework/docker/test-writer-entrypoint.sh]
    ports: !reset []
    env_file: !override
      - ../../.env.example
      - ./common.env
      - ./nodes/m2.env
      - ./browser.env
    environment:
      HILOS_TEST_OWNER_ROOT: /app
      HILOS_TEST_WRITE_DIRS: /app/data /app/data/status /var/log/hilos /app/vendor
      HILOS_TEST_OWN_DIRS: /hilos-test-logs
      HOME: /tmp
    volumes:
      - ../../data/logs-cluster:/hilos-test-logs
      - data:/app/data
      - ../../data/logs-cluster/m2:/var/log/hilos
      - status:/app/data/status
    depends_on: *seeded
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.12

  ecommerce-shop-cluster-s1:
    env_file:
      - ./browser.env
    environment:
      CLUSTER_SEEDS: 10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.11:8095,10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.12:8095,10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.15:8095
    depends_on: *seeded

  ecommerce-shop-cluster-s2:
    env_file:
      - ./browser.env
    environment:
      CLUSTER_SEEDS: 10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.11:8095,10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.12:8095,10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.14:8095
    depends_on: *seeded

  ecommerce-shop-cluster-entry:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    build:
      context: ..
      dockerfile: Dockerfile.nginx
    container_name: ecommerce-shop-cluster-entry${HILOS_STAND_SUFFIX:-}
    volumes:
      - ../nginx.cluster.conf.template:/etc/nginx/nginx.conf.template:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - data:/stand-data:ro
      - status:/status:ro
    depends_on:
      - ecommerce-shop-cluster-m1
      - ecommerce-shop-cluster-m2
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.30

  ecommerce-shop-cluster-mailpit:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: ecommerce-shop-cluster-mailpit${HILOS_STAND_SUFFIX:-}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: UTC
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    profiles: [e2e]
    networks:
      cluster-net:
        ipv4_address: 10.${HILOS_STAND_NET_ECOMMERCE_SHOP_CLUSTER:-222}.0.20

  ecommerce-shop-cluster-e2e-runner:
    cpu_shares: ${HILOS_STAND_CPU_SHARES:-0}
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    container_name: ecommerce-shop-cluster-e2e-runner${HILOS_STAND_SUFFIX:-}
    entrypoint: [sh, /hilos/framework/docker/test-writer-entrypoint.sh]
    tmpfs:
      - /tmp
    volumes:
      - ../../../..:/hilos
    working_dir: /hilos/demo/ecommerce-shop/tests/e2e
    environment:
      HILOS_TEST_OWNER_ROOT: /hilos
      HILOS_TEST_WRITE_DIRS: >-
        /hilos/demo/ecommerce-shop/tests/e2e/node_modules /hilos/demo/ecommerce-shop/tests/e2e/test-results
        /hilos/demo/ecommerce-shop/tests/e2e/playwright-report /hilos/demo/ecommerce-shop/tests/.hilos-cluster-e2e
      HOME: /tmp
      CI: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      COMMAND_PORT: "8094"
      MAILPIT_URL: http://ecommerce-shop-cluster-mailpit:8025
      HILOS_E2E_TIMEOUT_SCALE: ${HILOS_E2E_TIMEOUT_SCALE:-}
    profiles: [e2e]
    networks:
      - cluster-net
