    <rect width="32" height="32" fill="#fff"/>
    <circle cx="25" cy="7" r="9" fill="#000"/>
  </mask>
  <g id="demo-symbol" fill="#845EF7" mask="url(#hilos-mark-gap)">
    <path transform="matrix(2.4 0 0 2.4 -26.4 -21.8)" d="M13 11.5H19A2 2 0 0 1 21 13.5V17.5A2 2 0 0 1 19 19.5H16L12 22V19.3A2 2 0 0 1 11 17.5V13.5A2 2 0 0 1 13 11.5Z"/>
