<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">Hilos Chat — speech bubble</title>
  <desc id="desc">A violet speech bubble. In the top-right corner, a plain blue dot.</desc>
  <!-- HIL-2151: the small sign of the chat demo.
       Symbol: the HIL-1316 speech bubble, original geometry.
       Corner mark: the Hilos logo, original geometry. MIT; see ../README.md. -->
